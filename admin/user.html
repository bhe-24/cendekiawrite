<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kelola Pengguna - Cendekia Aksara Admin</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* --- GLOBAL & COLORS --- */
        :root {
            --nav-bg: #0f172a;       
            --primary: #003366;      
            --gold: #d4af37;         
            --bg-color: #f1f5f9;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --danger: #dc2626;
            --success: #10b981;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif; background-color: var(--bg-color);
            color: var(--text-dark); margin: 0; padding: 0; padding-top: 60px; min-height: 100vh;
        }

        /* --- MOBILE FIRST WRAPPER --- */
        .app-wrapper {
            width: 100%; max-width: 600px; margin: 0 auto;
            background-color: var(--bg-color); min-height: 100vh;
            display: flex; flex-direction: column; position: relative;
        }

        @media (min-width: 768px) {
            body { background-color: #cbd5e1; } 
            .app-wrapper { border-left: 1px solid #94a3b8; border-right: 1px solid #94a3b8; box-shadow: 0 0 40px rgba(0,0,0,0.15); }
            .top-navbar { max-width: 600px; left: 50% !important; transform: translateX(-50%); }
        }

        /* --- FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: #001f3f;
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-bottom: 2px solid var(--gold);
        }
        .btn-icon { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .btn-icon:hover { color: var(--gold); }
        .nav-title { font-family: 'Aleo', serif; font-size: 1.1rem; color: white; margin: 0; letter-spacing: 0.5px;}

        /* --- PENCARIAN & FILTER --- */
        .search-section {
            background: white; padding: 20px; border-bottom: 1px solid #e2e8f0;
            position: sticky; top: 60px; z-index: 99; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .search-box {
            display: flex; align-items: center; background: #f8fafc;
            border: 1px solid #cbd5e1; border-radius: 50px; padding: 10px 15px;
            transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,51,102,0.1); background: white; }
        .search-box input { border: none; outline: none; background: transparent; flex: 1; font-family: 'Poppins'; font-size: 0.9rem; margin-left: 10px; color: var(--text-dark);}
        .search-box i { color: #94a3b8; }

        /* --- USER LIST --- */
        .user-list-container { padding: 20px; flex: 1; overflow-y: auto; }
        
        .user-card {
            background: white; border-radius: 16px; padding: 15px; margin-bottom: 15px;
            display: flex; align-items: center; gap: 15px; border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: 0.2s; position: relative;
        }
        .user-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .user-card.blocked { opacity: 0.6; filter: grayscale(100%); }
        .user-card.blocked::after {
            content: 'DIBLOKIR'; position: absolute; top: 10px; right: 10px;
            background: var(--danger); color: white; font-size: 0.6rem; font-weight: 700;
            padding: 2px 8px; border-radius: 4px; letter-spacing: 1px;
        }

        .user-ava {
            width: 50px; height: 50px; border-radius: 50%; background-color: #cbd5e1;
            background-size: cover; background-position: center; flex-shrink: 0;
            border: 2px solid #f1f5f9;
        }
        .user-info { flex: 1; overflow: hidden; }
        .user-name { font-size: 0.95rem; font-weight: 700; color: var(--text-dark); margin: 0 0 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-email { font-size: 0.75rem; color: var(--text-gray); margin: 0 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .role-badge { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 3px 10px; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.5px; }
        .role-admin { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        .role-user { background: #eff6ff; color: #3b82f6; border: 1px solid #bfdbfe; }

        .btn-action {
            background: #f8fafc; border: 1px solid #cbd5e1; color: var(--text-dark);
            width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .btn-action:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* LOADING */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--nav-bg); z-index: 5000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
        }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;}
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 50px 20px; color: #94a3b8; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: #cbd5e1; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-family: 'Poppins'; font-weight: 500; font-size: 1rem; letter-spacing: 1px;">Memuat Data Pengguna...</div>
    </div>

    <div class="app-wrapper">
        
        <header class="top-navbar">
            <button class="btn-icon" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <h1 class="nav-title">Pengguna & Akses</h1>
            <div style="width: 24px;"></div>
        </header>

        <div class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Cari nama, email, atau username..." onkeyup="filterUsers()">
            </div>
            <div style="margin-top: 10px; font-size: 0.75rem; color: var(--text-gray); font-weight: 500;">
                Total: <span id="total-users">0</span> Pengguna Terdaftar
            </div>
        </div>

        <div class="user-list-container" id="user-list">
            <!-- Data Pengguna Diisi oleh JS -->
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let allUsers = [];

        // 1. Kunci Keamanan Ganda (Auth & Role Admin)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const snap = await getDoc(doc(db, "users", user.uid));
                    if (snap.exists() && snap.data().role === 'admin') {
                        loadUsers();
                    } else {
                        kickOutHacker();
                    }
                } catch (error) {
                    kickOutHacker();
                }
            } else {
                window.location.href = '../login.html';
            }
        });

        function kickOutHacker() {
            Swal.fire({ title: 'Akses Ditolak!', text: 'Area Administrator.', icon: 'error', confirmButtonColor: '#dc2626', allowOutsideClick: false })
            .then(() => { window.location.href = '../index.html'; });
        }

        // 2. Tarik Data Pengguna
        async function loadUsers() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                allUsers = [];
                querySnapshot.forEach((doc) => {
                    allUsers.push({ id: doc.id, ...doc.data() });
                });

                // Urutkan admin di atas, lalu berdasarkan nama
                allUsers.sort((a, b) => {
                    if (a.role === 'admin' && b.role !== 'admin') return -1;
                    if (a.role !== 'admin' && b.role === 'admin') return 1;
                    return (a.name || '').localeCompare(b.name || '');
                });

                document.getElementById('total-users').innerText = allUsers.length;
                renderUsers(allUsers);
                document.getElementById('loading-overlay').style.display = 'none';

            } catch (error) {
                console.error("Gagal memuat pengguna:", error);
                Swal.fire('Error', 'Gagal menarik data dari server.', 'error');
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        // 3. Render Data ke Layar
        function renderUsers(usersArray) {
            const container = document.getElementById('user-list');
            if (usersArray.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-users-slash"></i><p>Tidak ada pengguna ditemukan.</p></div>`;
                return;
            }

            let html = '';
            usersArray.forEach(u => {
                const bg = u.profilePicBase64 ? `url('${u.profilePicBase64}')` : 'none';
                const roleClass = u.role === 'admin' ? 'role-admin' : 'role-user';
                const roleText = u.role === 'admin' ? '<i class="fa-solid fa-shield"></i> Admin' : 'Pengguna';
                const blockClass = u.isBlocked ? 'blocked' : '';

                html += `
                    <div class="user-card ${blockClass}">
                        <div class="user-ava" style="background-image: ${bg};"></div>
                        <div class="user-info">
                            <h4 class="user-name">${u.name || 'Tanpa Nama'}</h4>
                            <p class="user-email">${u.email || '@' + (u.username || 'anonim')}</p>
                            <span class="role-badge ${roleClass}">${roleText}</span>
                        </div>
                        <button class="btn-action" onclick="showUserOptions('${u.id}', '${u.name || 'Pengguna'}', '${u.role}', ${u.isBlocked || false})">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 4. Pencarian Real-time
        window.filterUsers = () => {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = allUsers.filter(u => {
                const name = (u.name || '').toLowerCase();
                const email = (u.email || '').toLowerCase();
                const username = (u.username || '').toLowerCase();
                return name.includes(query) || email.includes(query) || username.includes(query);
            });
            renderUsers(filtered);
        };

        // 5. Menu Opsi Pengguna
        window.showUserOptions = (uid, name, currentRole, isBlocked) => {
            const roleActionText = currentRole === 'admin' ? 'Turunkan ke Pengguna Biasa' : 'Jadikan Administrator';
            const roleIcon = currentRole === 'admin' ? '<i class="fa-solid fa-user-minus"></i>' : '<i class="fa-solid fa-user-shield"></i>';
            
            const blockActionText = isBlocked ? 'Buka Blokir Akun' : 'Blokir Akun';
            const blockIcon = isBlocked ? '<i class="fa-solid fa-unlock"></i>' : '<i class="fa-solid fa-ban"></i>';
            const blockColor = isBlocked ? '#10b981' : '#dc2626';

            Swal.fire({
                title: `Kelola: ${name}`,
                html: `
                    <div style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
                        <button onclick="changeRole('${uid}', '${currentRole}')" style="width:100%; padding:12px; border:1px solid #cbd5e1; background:white; border-radius:10px; font-family:'Poppins'; font-weight:600; color:#003366; cursor:pointer;">${roleIcon} ${roleActionText}</button>
                        <button onclick="toggleBlock('${uid}', ${isBlocked})" style="width:100%; padding:12px; border:1px solid ${blockColor}; background:white; border-radius:10px; font-family:'Poppins'; font-weight:600; color:${blockColor}; cursor:pointer;">${blockIcon} ${blockActionText}</button>
                    </div>
                `,
                showConfirmButton: false,
                showCloseButton: true
            });
        };

        // 6. Aksi: Ubah Role
        window.changeRole = async (uid, currentRole) => {
            Swal.close();
            const newRole = currentRole === 'admin' ? 'user' : 'admin';
            const confirmMsg = currentRole === 'admin' ? 'yakin ingin mencabut akses admin pengguna ini?' : 'yakin ingin memberikan akses penuh administrator kepada pengguna ini?';

            const confirm = await Swal.fire({
                title: 'Konfirmasi', text: `Apakah Anda ${confirmMsg}`, icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#003366', cancelButtonColor: '#64748b', confirmButtonText: 'Ya, Lanjutkan'
            });

            if (confirm.isConfirmed) {
                Swal.fire({title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                try {
                    await updateDoc(doc(db, "users", uid), { role: newRole });
                    Swal.fire({toast:true, position:'top', icon:'success', title:'Akses diperbarui.', showConfirmButton:false, timer:1500});
                    loadUsers(); // Refresh data
                } catch(e) {
                    Swal.fire('Error', 'Gagal memperbarui peran.', 'error');
                }
            }
        };

        // 7. Aksi: Blokir/Buka Blokir
        window.toggleBlock = async (uid, isBlocked) => {
            Swal.close();
            const newStatus = !isBlocked;
            const confirmTitle = isBlocked ? 'Buka Blokir?' : 'Blokir Pengguna?';
            const confirmText = isBlocked ? 'Pengguna akan dapat masuk kembali ke platform.' : 'Pengguna tidak akan bisa mengakses aplikasinya lagi.';

            const confirm = await Swal.fire({
                title: confirmTitle, text: confirmText, icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#dc2626', cancelButtonColor: '#64748b', confirmButtonText: 'Ya, Eksekusi'
            });

            if (confirm.isConfirmed) {
                Swal.fire({title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                try {
                    await updateDoc(doc(db, "users", uid), { isBlocked: newStatus });
                    Swal.fire({toast:true, position:'top', icon:'success', title:'Status akun diperbarui.', showConfirmButton:false, timer:1500});
                    loadUsers(); // Refresh data
                } catch(e) {
                    Swal.fire('Error', 'Gagal memproses blokir.', 'error');
                }
            }
        };

    </script>
</body>
</html>
