<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profil - Cendekia Aksara</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* --- GLOBAL & COLORS --- */
        :root {
            --nav-bg: rgba(15, 23, 42, 0.95);        
            --primary: #003366;      
            --gold: #d4af37;         
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0; padding: 0;
            padding-top: 60px; /* Spacer Navbar */
            min-height: 100vh;
        }

        /* --- MOBILE FIRST WRAPPER --- */
        .app-wrapper {
            width: 100%; max-width: 480px; margin: 0 auto;
            background-color: white; min-height: 100vh;
            display: flex; flex-direction: column; position: relative;
        }

        @media (min-width: 768px) {
            body { background-color: #e2e8f0; } 
            .app-wrapper { border-left: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; box-shadow: 0 0 40px rgba(0,0,0,0.1); }
            .top-navbar { max-width: 480px; left: 50% !important; transform: translateX(-50%); }
        }

        /* --- FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; z-index: 1000;
            background: var(--nav-bg); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .btn-icon {
            background: none; border: none; color: white;
            font-size: 1.2rem; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon:hover { color: var(--gold); }
        .nav-title { font-family: 'Aleo', serif; font-size: 1.1rem; color: white; margin: 0; letter-spacing: 0.5px; }

        /* --- HEADER PROFIL (SAMPUL & AVATAR) --- */
        .profile-cover {
            width: 100%; height: 160px; background-color: var(--primary);
            background-size: cover; background-position: center;
            position: relative; overflow: hidden;
        }
        .profile-avatar-wrapper {
            position: absolute; bottom: -45px; left: 20px;
            width: 90px; height: 90px; border-radius: 50%;
            border: 4px solid white; background-color: #cbd5e1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 2; overflow: hidden;
        }
        .profile-avatar {
            width: 100%; height: 100%; border-radius: 50%;
            background-size: cover; background-position: center;
        }
        .profile-actions {
            position: absolute; bottom: -40px; right: 20px; z-index: 2;
        }
        
        .btn-follow {
            background: linear-gradient(135deg, var(--gold), #b45309);
            color: white; border: none; padding: 6px 20px; border-radius: 50px;
            font-family: 'Poppins'; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); display: none;
        }
        .btn-follow.following {
            background: #f1f5f9; color: var(--text-dark); box-shadow: none; border: 1px solid #cbd5e1;
        }
        .btn-follow:disabled { opacity: 0.6; cursor: not-allowed; }

        /* --- INFO & STATISTIK --- */
        .profile-info { padding: 55px 20px 20px 20px; background: white; border-bottom: 1px solid #e2e8f0; }
        .profile-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: var(--text-dark); margin: 0 0 2px 0; }
        .profile-username { font-size: 0.85rem; color: var(--text-gray); margin: 0 0 15px 0; font-weight: 500;}
        
        .stats-row { display: flex; gap: 25px; }
        .stat-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .stat-num { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .stat-lbl { font-size: 0.7rem; color: var(--text-gray); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}

        /* --- TABS --- */
        .tab-container {
            display: flex; background: white; border-bottom: 1px solid #e2e8f0;
            position: sticky; top: 60px; z-index: 100;
        }
        .tab-btn {
            flex: 1; text-align: center; padding: 12px 0; cursor: pointer;
            font-size: 0.9rem; font-weight: 600; color: var(--text-gray);
            border-bottom: 3px solid transparent; transition: 0.3s;
        }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .content-area { display: none; padding: 20px; background: var(--bg-color); animation: fadeIn 0.3s ease; flex: 1;}
        .content-area.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(5px); } to { opacity:1; transform: translateY(0); } }

        /* --- SECTION COMPONENT --- */
        .section-box { margin-bottom: 25px; }
        .section-title { font-size: 1rem; font-weight: 700; color: var(--text-dark); margin: 0 0 10px 0; border-left: 3px solid var(--gold); padding-left: 10px;}
        .bio-text { font-size: 0.85rem; color: #475569; line-height: 1.6; margin: 0; background: white; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0;}

        /* --- HORIZONTAL SCROLL CARDS --- */
        .scroll-row { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 10px; scrollbar-width: none; }
        .scroll-row::-webkit-scrollbar { display: none; }
        
        .book-card { width: 100px; flex-shrink: 0; cursor: pointer; position: relative; }
        .book-cover { width: 100%; height: 140px; border-radius: 8px; background-size: cover; background-position: center; background-color: #cbd5e1; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 8px;}
        .book-title { font-size: 0.75rem; font-weight: 700; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2;}
        .book-badge-new {
            position: absolute; top: 6px; left: 6px; background: #059669; color: white;
            font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 5px; z-index: 2;
        }

        /* --- PERBAIKAN: MENGIKUTI (FOLLOWING) BULAT --- */
        .following-scroll { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scrollbar-width: none; }
        .following-scroll::-webkit-scrollbar { display: none; }
        
        .follow-circle-item { width: 65px; display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; cursor: pointer; transition: 0.2s;}
        .follow-circle-item:hover { transform: translateY(-3px); }
        .follow-circle-ava { 
            width: 55px; height: 55px; border-radius: 50%; background-size: cover; background-position: center; 
            background-color: #cbd5e1; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            display: flex; justify-content: center; align-items: center;
        }
        .follow-circle-name { 
            font-size: 0.7rem; color: var(--text-dark); font-weight: 500; text-align: center; 
            width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }

        /* --- PENGUMUMAN (FEED) --- */
        .announce-creator { background: white; padding: 15px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); display: none;}
        .announce-creator textarea { width: 100%; border: none; background: #f8fafc; padding: 12px; border-radius: 10px; font-family: 'Poppins'; font-size: 0.85rem; resize: none; min-height: 80px; margin-bottom: 10px; outline: none;}
        .announce-creator textarea:focus { box-shadow: 0 0 0 2px rgba(212,175,55,0.3); }
        .btn-post { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 50px; font-family: 'Poppins'; font-weight: 600; font-size: 0.85rem; cursor: pointer; float: right; transition: 0.2s;}
        .btn-post:hover { background: #001f3f; }

        .feed-item { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);}
        .feed-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px;}
        .feed-ava { width: 35px; height: 35px; border-radius: 50%; background-size: cover; background-color: #cbd5e1;}
        .feed-info h4 { margin: 0; font-size: 0.9rem; color: var(--text-dark); }
        .feed-info span { font-size: 0.7rem; color: #94a3b8; }
        .feed-text { font-size: 0.85rem; color: #334155; line-height: 1.5; margin: 0; white-space: pre-wrap;}

        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .empty-state i { font-size: 2.5rem; margin-bottom: 10px; color: #cbd5e1; }
        .empty-state p { margin: 0; font-size: 0.85rem; }

        /* LOADING */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 5000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;}
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- MODAL LIST PENGIKUT/MENGIKUTI (via SweetAlert2) --- */
        .modal-follow-item {
            display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px;
            border: 1px solid #e2e8f0; margin-bottom: 8px; cursor: pointer; text-align: left;
        }
        .modal-follow-ava { width: 36px; height: 36px; border-radius: 50%; background-size: cover; background-position: center; background-color: #cbd5e1; flex-shrink: 0; }

        /* --- SKELETON SHIMMER --- */
        @keyframes skeleton-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        .sk-dark, .sk-light { background-size: 400% 100%; animation: skeleton-shimmer 1.4s ease infinite; }
        .sk-dark { background: linear-gradient(90deg, rgba(255,255,255,0.15) 25%, rgba(255,255,255,0.28) 37%, rgba(255,255,255,0.15) 63%); }
        .sk-light { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 37%, #e2e8f0 63%); }
        .sk-line { border-radius: 6px; }
        .sk-name-line { height: 20px; width: 55%; margin-bottom: 8px; }
        .sk-username-line { height: 12px; width: 35%; }
        .sk-book-card { width: 100px; flex-shrink: 0; }
        .sk-book-cover { width: 100%; height: 140px; border-radius: 8px; margin-bottom: 8px; }
        .sk-book-line { height: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- OVERLAY LOADING -->
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div style="color: var(--primary); font-weight: 500; font-size: 0.9rem;">Menyinkronkan Profil...</div>
        </div>

        <!-- NAVBAR -->
        <header class="top-navbar">
            <button class="btn-icon" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <h1 class="nav-title">Profil</h1>
            <button class="btn-icon" id="btn-settings" style="display: none;" onclick="window.location.href='setting.html'"><i class="fa-solid fa-gear"></i></button>
            <div id="nav-spacer" style="width: 24px; display: none;"></div> 
        </header>

        <!-- HERO & HEADER -->
        <div class="profile-cover sk-dark" id="p-cover">
            <div class="profile-avatar-wrapper">
                <div class="profile-avatar sk-dark" id="p-avatar"></div>
            </div>
            <div class="profile-actions">
                <button class="btn-follow" id="btn-follow" onclick="toggleFollow()">Ikuti</button>
            </div>
        </div>

        <div class="profile-info">
            <div class="sk-light sk-line sk-name-line" id="p-name-skeleton"></div>
            <h2 class="profile-name" id="p-name" style="display:none;"></h2>

            <div class="sk-light sk-line sk-username-line" id="p-username-skeleton" style="margin-bottom:15px;"></div>
            <p class="profile-username" id="p-username" style="display:none;">@username</p>
            
            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-num" id="stat-karya">0</span>
                    <span class="stat-lbl">Karya</span>
                </div>
                <div class="stat-item" id="stat-pustaka-container">
                    <span class="stat-num" id="stat-pustaka">0</span>
                    <span class="stat-lbl">Pustaka</span>
                </div>
                <div class="stat-item" id="stat-pengikut-container" onclick="openFollowersModal()">
                    <span class="stat-num" id="stat-pengikut">0</span>
                    <span class="stat-lbl">Pengikut</span>
                </div>
            </div>
        </div>

        <!-- TABS -->
        <div class="tab-container">
            <div class="tab-btn active" onclick="switchTab('karya')">Profil & Karya</div>
            <div class="tab-btn" onclick="switchTab('pengumuman')">Pengumuman</div>
        </div>

        <!-- TAB CONTENT 1: PROFIL & KARYA -->
        <div class="content-area active" id="tab-karya">
            
            <div class="section-box">
                <h3 class="section-title">Tentang Saya</h3>
                <p class="bio-text" id="p-bio">Memuat bio...</p>
            </div>

            <div class="section-box">
                <h3 class="section-title">Karya Diterbitkan</h3>
                <div class="scroll-row" id="list-karya-skeleton">
                    <div class="sk-book-card"><div class="sk-light sk-book-cover"></div><div class="sk-light sk-book-line"></div></div>
                    <div class="sk-book-card"><div class="sk-light sk-book-cover"></div><div class="sk-light sk-book-line"></div></div>
                    <div class="sk-book-card"><div class="sk-light sk-book-cover"></div><div class="sk-light sk-book-line"></div></div>
                </div>
                <div class="scroll-row" id="list-karya" style="display:none;"></div>
            </div>

            <!-- Bagian Pustaka (Disembunyikan via JS jika pengunjung profil orang lain) -->
            <div class="section-box" id="section-pustaka">
                <h3 class="section-title">Daftar Bacaan (Pustaka)</h3>
                <div class="scroll-row" id="list-pustaka-skeleton">
                    <div class="sk-book-card"><div class="sk-light sk-book-cover"></div><div class="sk-light sk-book-line"></div></div>
                    <div class="sk-book-card"><div class="sk-light sk-book-cover"></div><div class="sk-light sk-book-line"></div></div>
                </div>
                <div class="scroll-row" id="list-pustaka" style="display:none;"></div>
            </div>

            <!-- PERBAIKAN: Skeleton Untuk Mengikuti (Bulat) -->
            <div class="section-box">
                <h3 class="section-title">Mengikuti</h3>
                <div class="following-scroll" id="list-following-skeleton">
                    <div class="follow-circle-item"><div class="follow-circle-ava sk-light"></div><div class="sk-light sk-line" style="width:40px; height:8px;"></div></div>
                    <div class="follow-circle-item"><div class="follow-circle-ava sk-light"></div><div class="sk-light sk-line" style="width:40px; height:8px;"></div></div>
                    <div class="follow-circle-item"><div class="follow-circle-ava sk-light"></div><div class="sk-light sk-line" style="width:40px; height:8px;"></div></div>
                </div>
                <div class="following-scroll" id="list-following" style="display:none;"></div>
            </div>

        </div>

        <!-- TAB CONTENT 2: PENGUMUMAN -->
        <div class="content-area" id="tab-pengumuman">
            
            <!-- Kotak Buat Pengumuman -->
            <div class="announce-creator" id="announce-box">
                <textarea id="announce-text" placeholder="Bagikan informasi terbaru, sapa pengikutmu, atau promosikan bab ceritamu yang baru terbit..."></textarea>
                <div style="overflow: hidden;">
                    <button class="btn-post" onclick="publishAnnouncement()">Publikasikan</button>
                </div>
            </div>

            <div id="feed-container">
                <div class="empty-state"><p>Memuat pengumuman...</p></div>
            </div>

        </div>

    </div>

    <!-- Script SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- RENDER INSTAN DARI CACHE LOKAL -->
    <script>
        (function () {
            function showReal(id) {
                var el = document.getElementById(id);
                if (el) el.style.display = '';
                var sk = document.getElementById(id + '-skeleton');
                if (sk) sk.style.display = 'none';
            }

            var params = new URLSearchParams(window.location.search);
            var queryUid = params.get('uid');
            var lastUid = null;
            try { lastUid = localStorage.getItem('cendekia_last_uid'); } catch (e) {}

            var isOwnGuess = !queryUid || (lastUid && queryUid === lastUid);

            if (isOwnGuess) {
                document.getElementById('btn-settings').style.display = 'block';
                document.getElementById('nav-spacer').style.display = 'none';
                document.getElementById('btn-follow').style.display = 'none';
                document.getElementById('announce-box').style.display = 'block';
                document.getElementById('section-pustaka').style.display = 'block';
                document.getElementById('stat-pustaka-container').style.display = 'flex';
            } else {
                document.getElementById('btn-settings').style.display = 'none';
                document.getElementById('nav-spacer').style.display = 'block';
                document.getElementById('btn-follow').style.display = 'block';
                document.getElementById('section-pustaka').style.display = 'none';
                document.getElementById('stat-pustaka-container').style.display = 'none';
            }

            var guessUid = queryUid || lastUid;
            if (!guessUid) return;

            try {
                var raw = localStorage.getItem('cendekia_profile_cache_' + guessUid);
                if (!raw) return;
                var c = JSON.parse(raw);

                if (c.name) { document.getElementById('p-name').innerText = c.name; showReal('p-name'); }
                if (c.username) { document.getElementById('p-username').innerText = c.username; showReal('p-username'); }
                if (c.bio) document.getElementById('p-bio').innerText = c.bio;
                
                if (c.coverUrl) {
                    document.getElementById('p-cover').style.backgroundImage = c.coverUrl;
                    document.getElementById('p-cover').classList.remove('sk-dark');
                }
                if (c.avatarUrl) {
                    document.getElementById('p-avatar').style.backgroundImage = c.avatarUrl;
                    document.getElementById('p-avatar').classList.remove('sk-dark');
                }
                
                if (typeof c.statKarya !== 'undefined') document.getElementById('stat-karya').innerText = c.statKarya;
                if (typeof c.statPustaka !== 'undefined') document.getElementById('stat-pustaka').innerText = c.statPustaka;
                if (typeof c.statPengikut !== 'undefined') document.getElementById('stat-pengikut').innerText = c.statPengikut;
                
                if (c.karyaHtml) { document.getElementById('list-karya').innerHTML = c.karyaHtml; showReal('list-karya'); }
                if (c.pustakaHtml) { document.getElementById('list-pustaka').innerHTML = c.pustakaHtml; showReal('list-pustaka'); }
                if (c.followingHtml) { document.getElementById('list-following').innerHTML = c.followingHtml; showReal('list-following'); }
                if (c.feedHtml) document.getElementById('feed-container').innerHTML = c.feedHtml;
            } catch (e) {}
        })();
    </script>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getFirestore, doc, getDoc, collection, query, where, getDocs,
            setDoc, deleteDoc, addDoc, serverTimestamp, orderBy, writeBatch, increment
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUserId = null; 
        let targetUserId = null;  
        let isOwnProfile = false;
        let targetUserData = null;
        let isFollowing = false;
        let isFollowActionPending = false;

        function toMillisSafe(ts) {
            if (!ts) return 0;
            if (typeof ts.toMillis === 'function') return ts.toMillis();
            if (typeof ts.seconds === 'number') return ts.seconds * 1000;
            return 0;
        }

        function showReal(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = '';
            const sk = document.getElementById(id + '-skeleton');
            if (sk) sk.style.display = 'none';
        }

        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-area').forEach(area => area.classList.remove('active'));
            
            if(tabName === 'karya') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-karya').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-pengumuman').classList.add('active');
            }
        };

        onAuthStateChanged(auth, (user) => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryUid = urlParams.get('uid');

            if (user) {
                currentUserId = user.uid;
                targetUserId = queryUid ? queryUid : currentUserId;
                try { localStorage.setItem('cendekia_last_uid', user.uid); } catch (e) {}
            } else {
                targetUserId = queryUid;
                if (!targetUserId) {
                    window.location.href = 'login.html';
                    return;
                }
            }

            isOwnProfile = (currentUserId === targetUserId);
            fetchProfileData();
        });

        async function setupUI() {
            if (isOwnProfile) {
                document.getElementById('btn-settings').style.display = 'block';
                document.getElementById('nav-spacer').style.display = 'none';
                document.getElementById('btn-follow').style.display = 'none';
                document.getElementById('announce-box').style.display = 'block';
                
                document.getElementById('section-pustaka').style.display = 'block';
                document.getElementById('stat-pustaka-container').style.display = 'flex';
            } else {
                document.getElementById('btn-settings').style.display = 'none';
                document.getElementById('nav-spacer').style.display = 'block';
                document.getElementById('btn-follow').style.display = 'block';
                document.getElementById('announce-box').style.display = 'none';
                
                document.getElementById('section-pustaka').style.display = 'none';
                document.getElementById('stat-pustaka-container').style.display = 'none';

                document.getElementById('btn-follow').innerText = "Ikuti";
                document.getElementById('btn-follow').classList.remove('following');
                
                await checkFollowStatus();
            }
        }

        async function fetchProfileData() {
            await setupUI(); 

            let displayName = '', displayUsername = '', bioText = '', coverUrl = '', avatarUrl = '';

            try {
                const userDoc = await getDoc(doc(db, "users", targetUserId));
                if (!userDoc.exists()) {
                    Swal.fire('Tidak Ditemukan', 'Profil ini tidak tersedia atau telah dihapus.', 'error').then(()=>window.location.href='index.html');
                    return;
                }

                targetUserData = userDoc.data();
                
                displayName = targetUserData.penName || targetUserData.name || 'Penulis Cendekia';
                displayUsername = '@' + (targetUserData.username || `user${targetUserId.substring(0,5)}`);
                bioText = targetUserData.bio || 'Pengguna ini belum menuliskan bio.';

                document.getElementById('p-name').innerText = displayName;
                showReal('p-name');
                document.getElementById('p-username').innerText = displayUsername;
                showReal('p-username');
                document.getElementById('p-bio').innerText = bioText;
                
                if (targetUserData.coverBase64) {
                    coverUrl = `url('${targetUserData.coverBase64}')`;
                    document.getElementById('p-cover').style.backgroundImage = coverUrl;
                }
                if (targetUserData.profilePicBase64) {
                    avatarUrl = `url('${targetUserData.profilePicBase64}')`;
                    document.getElementById('p-avatar').style.backgroundImage = avatarUrl;
                }
                
                // Pastikan class animasi dihilangkan
                document.getElementById('p-cover').classList.remove('sk-dark');
                document.getElementById('p-avatar').classList.remove('sk-dark');

                document.getElementById('stat-pengikut').innerText = targetUserData.followersCount || 0;
            } catch (error) {
                console.error("Gagal memuat data utama profil:", error);
                if (document.getElementById('p-name').style.display === 'none') {
                    Swal.fire('Error Sistem', 'Gagal memuat data profil. Periksa koneksi Anda.', 'error');
                }
                return; 
            }

            const [karyaResult, pustakaResult, followingResult, followersResult, feedResult] = await Promise.allSettled([
                loadKarya(),
                (isOwnProfile ? loadPustaka() : Promise.resolve(null)),
                loadFollowing(),
                loadFollowersCount(),
                fetchAnnouncements()
            ]);

            saveProfileCache({
                name: displayName, username: displayUsername, bio: bioText, coverUrl, avatarUrl,
                statKarya: karyaResult.status === 'fulfilled' ? karyaResult.value.count : undefined,
                statPustaka: pustakaResult.status === 'fulfilled' && pustakaResult.value ? pustakaResult.value.count : undefined,
                statPengikut: followersResult.status === 'fulfilled' ? followersResult.value : undefined,
                karyaHtml: karyaResult.status === 'fulfilled' ? karyaResult.value.html : undefined,
                pustakaHtml: pustakaResult.status === 'fulfilled' && pustakaResult.value ? pustakaResult.value.html : undefined,
                followingHtml: followingResult.status === 'fulfilled' ? followingResult.value : undefined,
                feedHtml: feedResult.status === 'fulfilled' ? feedResult.value : undefined
            });
        }

        function saveProfileCache(payload) {
            try {
                localStorage.setItem('cendekia_profile_cache_' + targetUserId, JSON.stringify({ ...payload, cachedAt: Date.now() }));
            } catch (e) {}
        }

        async function loadFollowersCount() {
            try {
                const snapFollowers = await getDocs(collection(db, "users", targetUserId, "followers"));
                document.getElementById('stat-pengikut').innerText = snapFollowers.size;
                return snapFollowers.size;
            } catch (error) {
                console.error("Gagal menghitung pengikut:", error);
                return undefined;
            }
        }

        async function checkFollowStatus() {
            if (!currentUserId) return; 
            try {
                const followDoc = await getDoc(doc(db, "users", currentUserId, "following", targetUserId));
                const btn = document.getElementById('btn-follow');
                if (followDoc.exists()) {
                    isFollowing = true;
                    btn.innerText = "Mengikuti";
                    btn.classList.add('following');
                } else {
                    isFollowing = false;
                    btn.innerText = "Ikuti";
                    btn.classList.remove('following');
                }
            } catch (error) {
                console.error("Gagal memeriksa status mengikuti:", error);
            }
        }

        window.toggleFollow = async () => {
            if (!currentUserId) {
                Swal.fire('Akses Ditolak', 'Silakan masuk untuk mengikuti penulis ini.', 'info').then(()=>window.location.href='login.html');
                return;
            }
            if (isFollowActionPending) return; 
            isFollowActionPending = true;

            const btn = document.getElementById('btn-follow');
            btn.disabled = true;

            const targetRef = doc(db, "users", targetUserId);
            const followingRef = doc(db, "users", currentUserId, "following", targetUserId);
            const followerRef = doc(db, "users", targetUserId, "followers", currentUserId);

            try {
                if (isFollowing) {
                    const batch = writeBatch(db);
                    batch.delete(followingRef);
                    batch.delete(followerRef);
                    batch.update(targetRef, { followersCount: increment(-1) });
                    await batch.commit();

                    isFollowing = false;
                    btn.innerText = "Ikuti";
                    btn.classList.remove('following');
                } else {
                    let myProfileData = {};
                    try {
                        const mySnap = await getDoc(doc(db, "users", currentUserId));
                        if (mySnap.exists()) myProfileData = mySnap.data();
                    } catch (e) {
                        console.error("Gagal mengambil data profil sendiri:", e);
                    }

                    let myDisplayName = myProfileData.penName || myProfileData.name || 'Penulis Cendekia';
                    let targetDisplayName = targetUserData.penName || targetUserData.name || 'Penulis Cendekia';

                    const batch = writeBatch(db);
                    batch.set(followingRef, {
                        name: targetDisplayName,
                        username: targetUserData.username || '',
                        avatarBase64: targetUserData.profilePicBase64 || null,
                        followedAt: serverTimestamp()
                    });
                    batch.set(followerRef, {
                        name: myDisplayName,
                        username: myProfileData.username || '',
                        avatarBase64: myProfileData.profilePicBase64 || null,
                        followedAt: serverTimestamp()
                    });
                    batch.update(targetRef, { followersCount: increment(1) });
                    await batch.commit();

                    isFollowing = true;
                    btn.innerText = "Mengikuti";
                    btn.classList.add('following');

                    try {
                        await addDoc(collection(db, "users", targetUserId, "notifications"), {
                            title: "Pengikut Baru",
                            message: `${myDisplayName} baru saja mengikuti Anda.`,
                            type: "system",
                            isRead: false,
                            targetUrl: `profil.html?uid=${currentUserId}`,
                            createdAt: serverTimestamp()
                        });
                    } catch (e) {}

                    Swal.fire({toast:true, position:'top-end', icon:'success', title:'Mengikuti', showConfirmButton:false, timer:1500});
                }

                await loadFollowersCount();

            } catch (error) {
                console.error("Gagal follow/unfollow:", error);
                Swal.fire('Error', 'Gagal memproses permintaan. Coba lagi.', 'error');
            }
            
            btn.disabled = false;
            isFollowActionPending = false;
        };

        window.openFollowersModal = async () => {
            Swal.fire({ title: 'Memuat Pengikut...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const snap = await getDocs(query(collection(db, "users", targetUserId, "followers"), orderBy("followedAt", "desc")));
                if (snap.empty) {
                    Swal.fire('Belum Ada Pengikut', 'Profil ini belum memiliki pengikut.', 'info');
                    return;
                }
                let listHtml = '<div style="max-height: 320px; overflow-y: auto; text-align:left;">';
                snap.forEach(d => {
                    const f = d.data();
                    const bg = f.avatarBase64 ? `url('${f.avatarBase64}')` : 'none';
                    listHtml += `
                        <div class="modal-follow-item" onclick="window.location.href='profil.html?uid=${d.id}'">
                            <div class="modal-follow-ava" style="background-image: ${bg};"></div>
                            <div>
                                <div style="font-size:0.85rem; font-weight:600; color:var(--text-dark);">${f.name || 'Penulis Cendekia'}</div>
                                <div style="font-size:0.75rem; color:var(--text-gray);">@${f.username || `user${d.id.substring(0,5)}`}</div>
                            </div>
                        </div>
                    `;
                });
                listHtml += '</div>';
                Swal.fire({ title: 'Pengikut', html: listHtml, showConfirmButton: false, showCloseButton: true });
            } catch (error) {
                console.error("Gagal memuat daftar pengikut:", error);
                Swal.fire('Error', 'Gagal memuat daftar pengikut.', 'error');
            }
        };

        // --- FUNGSI BARU UNTUK MODAL MENGIKUTI ---
        window.openFollowingModal = async () => {
            Swal.fire({ title: 'Memuat Mengikuti...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const snap = await getDocs(query(collection(db, "users", targetUserId, "following"), orderBy("followedAt", "desc")));
                if (snap.empty) {
                    Swal.fire('Belum Mengikuti', 'Profil ini belum mengikuti siapapun.', 'info');
                    return;
                }
                let listHtml = '<div style="max-height: 320px; overflow-y: auto; text-align:left;">';
                snap.forEach(d => {
                    const f = d.data();
                    const bg = f.avatarBase64 ? `url('${f.avatarBase64}')` : 'none';
                    listHtml += `
                        <div class="modal-follow-item" onclick="window.location.href='profil.html?uid=${d.id}'">
                            <div class="modal-follow-ava" style="background-image: ${bg};"></div>
                            <div>
                                <div style="font-size:0.85rem; font-weight:600; color:var(--text-dark);">${f.name || 'Penulis Cendekia'}</div>
                                <div style="font-size:0.75rem; color:var(--text-gray);">@${f.username || `user${d.id.substring(0,5)}`}</div>
                            </div>
                        </div>
                    `;
                });
                listHtml += '</div>';
                Swal.fire({ title: 'Mengikuti', html: listHtml, showConfirmButton: false, showCloseButton: true });
            } catch (error) {
                console.error("Gagal memuat daftar mengikuti:", error);
                Swal.fire('Error', 'Gagal memuat daftar mengikuti.', 'error');
            }
        };

        async function loadKarya() {
            try {
                const qKarya = query(collection(db, "published_stories"), where("authorId", "==", targetUserId));
                const snapKarya = await getDocs(qKarya);

                let karyaList = [];
                snapKarya.forEach(d => karyaList.push({ id: d.id, ...d.data() }));

                karyaList.sort((a, b) => {
                    const timeA = toMillisSafe(a.publishedAt) || toMillisSafe(a.updatedAt);
                    const timeB = toMillisSafe(b.publishedAt) || toMillisSafe(b.updatedAt);
                    return timeB - timeA;
                });

                document.getElementById('stat-karya').innerText = karyaList.length;

                const now = Date.now();
                const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;

                let karyaHtml = '';
                karyaList.forEach(k => {
                    const bg = k.coverBase64 ? `url('${k.coverBase64}')` : 'none';
                    const publishedTime = toMillisSafe(k.publishedAt);
                    const isNew = publishedTime > 0 && (now - publishedTime) < sevenDaysMs;
                    const badge = isNew ? `<span class="book-badge-new">Baru</span>` : '';

                    karyaHtml += `
                        <div class="book-card" onclick="window.location.href='pratinjau.html?id=${k.id}'">
                            ${badge}
                            <div class="book-cover" style="background-image: ${bg}; border-color:var(--gold);"></div>
                            <h4 class="book-title" style="color:var(--primary);">${k.title || 'Tanpa Judul'}</h4>
                        </div>
                    `;
                });

                const finalHtml = karyaHtml || `<div class="empty-state" style="padding:20px;"><p>Belum ada karya.</p></div>`;
                document.getElementById('list-karya').innerHTML = finalHtml;
                showReal('list-karya');
                return { html: finalHtml, count: karyaList.length };
            } catch (error) {
                console.error("Error Karya:", error);
                document.getElementById('list-karya').innerHTML = `<div class="empty-state" style="padding:20px;"><p>Gagal memuat karya.</p></div>`;
                showReal('list-karya');
                return { html: undefined, count: undefined };
            }
        }

        async function loadPustaka() {
            try {
                const qPustaka = query(collection(db, "users", targetUserId, "library"), where("isArchived", "==", false));
                const snapPustaka = await getDocs(qPustaka);

                let pustakaHtml = '';
                snapPustaka.forEach(d => {
                    const p = d.data();
                    const bg = p.coverBase64 ? `url('${p.coverBase64}')` : 'none';
                    pustakaHtml += `
                        <div class="book-card" onclick="window.location.href='pratinjau.html?id=${p.storyId}'">
                            <div class="book-cover" style="background-image: ${bg};"></div>
                            <h4 class="book-title">${p.title || 'Tanpa Judul'}</h4>
                        </div>
                    `;
                });
                const finalHtml = pustakaHtml || `<div class="empty-state" style="padding:20px;"><p>Pustaka kosong.</p></div>`;
                document.getElementById('stat-pustaka').innerText = snapPustaka.size;
                document.getElementById('list-pustaka').innerHTML = finalHtml;
                showReal('list-pustaka');
                return { html: finalHtml, count: snapPustaka.size };
            } catch (error) {
                console.error("Error Pustaka:", error);
                document.getElementById('list-pustaka').innerHTML = `<div class="empty-state" style="padding:20px;"><p>Gagal memuat pustaka.</p></div>`;
                showReal('list-pustaka');
                return { html: undefined, count: undefined };
            }
        }

        // --- PERBAIKAN: Fungsi Mengikuti Menjadi Lingkaran Horisontal ---
        async function loadFollowing() {
            try {
                const qFollow = query(collection(db, "users", targetUserId, "following"), orderBy("followedAt", "desc"));
                const snapFollow = await getDocs(qFollow);
                
                let followList = [];
                snapFollow.forEach(d => followList.push({id: d.id, ...d.data()}));

                const displayLimit = 10;
                const itemsToShow = followList.slice(0, displayLimit);

                let followHtml = '';
                
                itemsToShow.forEach(f => {
                    const bg = f.avatarBase64 ? `url('${f.avatarBase64}')` : 'none';
                    const uname = f.username || `user${f.id.substring(0,5)}`;
                    followHtml += `
                        <div class="follow-circle-item" onclick="window.location.href='profil.html?uid=${f.id}'">
                            <div class="follow-circle-ava" style="background-image: ${bg};"></div>
                            <div class="follow-circle-name">@${uname}</div>
                        </div>
                    `;
                });

                if (followList.length > displayLimit) {
                    followHtml += `
                        <div class="follow-circle-item" onclick="openFollowingModal()">
                            <div class="follow-circle-ava" style="background: #f1f5f9; border: 1px dashed #cbd5e1; color: var(--primary);"><i class="fa-solid fa-arrow-right"></i></div>
                            <div class="follow-circle-name" style="color:var(--primary); font-weight:700;">Lihat<br>Semua</div>
                        </div>
                    `;
                }

                const finalHtml = followHtml || `<div class="empty-state" style="padding:20px; width:100%;"><p>Belum mengikuti siapapun.</p></div>`;
                document.getElementById('list-following').innerHTML = finalHtml;
                showReal('list-following');
                return finalHtml;
            } catch (error) {
                console.error("Error Follow:", error);
                document.getElementById('list-following').innerHTML = `<div class="empty-state" style="padding:20px; width:100%;"><p>Gagal memuat daftar mengikuti.</p></div>`;
                showReal('list-following');
                return undefined;
            }
        }

        async function fetchAnnouncements() {
            try {
                const qFeed = query(collection(db, "users", targetUserId, "announcements"), orderBy("createdAt", "desc"));
                const snapFeed = await getDocs(qFeed);
                const container = document.getElementById('feed-container');

                if (snapFeed.empty) {
                    const emptyHtml = `<div class="empty-state"><i class="fa-solid fa-comment-slash"></i><p>Belum ada pengumuman.</p></div>`;
                    container.innerHTML = emptyHtml;
                    return emptyHtml;
                }

                let displayName = targetUserData.penName || targetUserData.name || 'Penulis Cendekia';

                let html = '';
                snapFeed.forEach(d => {
                    const data = d.data();
                    const bg = targetUserData.profilePicBase64 ? `url('${targetUserData.profilePicBase64}')` : 'none';
                    const timeObj = data.createdAt ? data.createdAt.toDate() : new Date();
                    const timeStr = timeObj.toLocaleDateString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

                    html += `
                        <div class="feed-item">
                            <div class="feed-header">
                                <div class="feed-ava" style="background-image: ${bg};"></div>
                                <div class="feed-info">
                                    <h4>${displayName}</h4>
                                    <span>${timeStr} WIB</span>
                                </div>
                            </div>
                            <p class="feed-text">${data.text}</p>
                        </div>
                    `;
                });
                container.innerHTML = html;
                return html;
            } catch(e) {
                console.error("Error Feed:", e);
                document.getElementById('feed-container').innerHTML = `<div class="empty-state"><p>Gagal memuat pengumuman.</p></div>`;
                return undefined;
            }
        }

        window.publishAnnouncement = async () => {
            const text = document.getElementById('announce-text').value.trim();
            if (!text) {
                Swal.fire({toast:true, position:'top', icon:'warning', title:'Tuliskan sesuatu dahulu.', showConfirmButton:false, timer:1500});
                return;
            }

            try {
                await addDoc(collection(db, "users", currentUserId, "announcements"), {
                    text: text,
                    createdAt: serverTimestamp()
                });

                document.getElementById('announce-text').value = '';
                fetchAnnouncements(); 
                
                Swal.fire({ toast:true, position:'top', icon:'success', title:'Dipublikasikan', showConfirmButton:false, timer:1500 });
            } catch (error) {
                Swal.fire('Error', 'Gagal mempublikasikan pengumuman.', 'error');
            }
        };

    </script>
</body>
