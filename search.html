<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pencarian - Aksara Narasi</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512x512.png">
    <link rel="apple-touch-icon" href="/assets/icon-192x192.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003366; --gold: #d4af37; --bg-color: #f8fafc; --text-dark: #1e293b; --text-gray: #64748b; }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;}
        .app-wrapper { width: 100%; max-width: 480px; margin: 0 auto; background-color: white; flex: 1; display: flex; flex-direction: column; }
        @media (min-width: 768px) { body { background-color: #e2e8f0; } .app-wrapper { border-left: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; box-shadow: 0 0 40px rgba(0,0,0,0.1); } }

        .search-header { display: flex; align-items: center; gap: 15px; padding: 15px 20px; background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100;}
        .btn-back { background: none; border: none; font-size: 1.2rem; color: var(--text-dark); cursor: pointer; transition: 0.2s;}
        .btn-back:hover { color: var(--primary); }
        .search-input-box { flex: 1; display: flex; align-items: center; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 50px; padding: 10px 15px; transition: 0.3s;}
        .search-input-box:focus-within { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(0,51,102,0.1);}
        .search-input-box input { border: none; outline: none; width: 100%; font-family: 'Poppins'; font-size: 0.95rem; margin: 0 10px; background: transparent; min-width: 0; }
        .btn-clear-search { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1rem; padding: 2px; display: none; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
        .btn-clear-search.show { display: flex; }
        .btn-clear-search:hover { color: #dc2626; }
        
        .search-body { padding: 20px; flex: 1; overflow-y: auto; }
        .section-title { font-size: 0.9rem; font-weight: 700; color: var(--text-dark); margin: 0 0 15px 0; display: flex; justify-content: space-between; align-items: center;}
        .clear-btn { color: #dc2626; font-size: 0.75rem; cursor: pointer; border: none; background: rgba(220, 38, 38, 0.1); padding: 4px 10px; border-radius: 50px; font-family: 'Poppins'; font-weight: 600; transition: 0.2s;}
        .clear-btn:hover { background: #dc2626; color: white;}

        .history-list { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 35px; }
        .history-chip { background: white; border: 1px solid #cbd5e1; padding: 6px 15px; border-radius: 50px; font-size: 0.8rem; color: var(--text-gray); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;}
        .history-chip:hover { border-color: var(--primary); color: var(--primary); background: #f8fafc;}

        .recommend-list { display: flex; flex-direction: column; gap: 12px; }
        .rec-item { font-size: 0.9rem; color: var(--primary); padding: 12px 15px; border-radius: 12px; background: #f8fafc; font-weight: 600; cursor: pointer; transition: 0.2s; border: 1px solid transparent; display: flex; align-items: center; justify-content: space-between; }
        .rec-item:hover { border-color: var(--gold); transform: translateX(5px);}
        .rec-item .rec-label { display: flex; align-items: center; }
        .rec-item i { color: var(--gold); margin-right: 10px; font-size: 1.1rem;}
        .rec-item .rec-count { font-size: 0.7rem; color: #94a3b8; font-weight: 500; }
        .rec-skeleton { height: 44px; border-radius: 12px; margin-bottom: 12px; background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 37%, #e2e8f0 63%); background-size: 400% 100%; animation: skeleton-shimmer 1.4s ease infinite; }
        @keyframes skeleton-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

        /* Hasil Pencarian */
        .story-card { display:flex; gap:15px; cursor:pointer; padding: 15px; border-radius: 16px; background: white; border:1px solid #e2e8f0; margin-bottom: 15px; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02);}
        .story-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.06);}
        .story-cover { width: 70px; height: 100px; border-radius: 8px; background-color:#cbd5e1; background-size: cover; background-position: center; flex-shrink: 0; border: 1px solid #e2e8f0;}
        .story-info { display: flex; flex-direction: column; justify-content: center; overflow: hidden;}
        .story-info h4 { margin: 0 0 5px 0; font-size: 1rem; color: var(--primary); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        .story-info p { margin: 0 0 8px 0; font-size: 0.8rem; color: var(--text-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .story-tags-wrap { display: flex; flex-wrap: wrap; gap: 5px; }

        .empty-state { text-align:center; padding: 50px 20px; color: #94a3b8; }
        .empty-state i { font-size: 3rem; color: #cbd5e1; margin-bottom: 15px;}
        .result-count-label { font-size: 0.78rem; color: var(--text-gray); margin: 0 0 15px 0; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="search-header">
            <button class="btn-back" onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass" style="color: #94a3b8;"></i>
                <input type="text" id="search-input" placeholder="Gunakan #tagar, @penulis..." autofocus>
                <button type="button" class="btn-clear-search" id="btn-clear-search" onclick="clearSearchInput()"><i class="fa-solid fa-circle-xmark"></i></button>
            </div>
        </div>

        <div class="search-body" id="search-body">
            <div id="default-view">
                <h3 class="section-title">Riwayat Pencarian <button class="clear-btn" onclick="clearHistory()">Hapus</button></h3>
                <div class="history-list" id="history-list"></div>

                <h3 class="section-title">Rekomendasi Populer</h3>
                <div class="recommend-list" id="recommend-list">
                    <div class="rec-skeleton"></div>
                    <div class="rec-skeleton"></div>
                    <div class="rec-skeleton"></div>
                </div>
            </div>

            <!-- Tempat Hasil Pencarian -->
            <div id="results-view" style="display: none;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", authDomain: "mading-cf676.firebaseapp.com", projectId: "mading-cf676", storageBucket: "mading-cf676.firebasestorage.app", messagingSenderId: "72175203671", appId: "1:72175203671:web:7a0676a55beb64bc96ba12" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        const SEARCH_CACHE_KEY = 'cendekia_search_cache_v1';

        let allStories = [];
        let authorCache = {}; 
        let searchTimer;

        let dataReady = false;
        let pendingQuery = null;
        let trackedTags = new Set(); // Mencegah spam tracking di 1 sesi

        function getSkeletonHTML() {
            return `
                <div style="display:flex; flex-direction:column;">
                    ${[1,2,3].map(() => `
                    <div class="story-card" style="pointer-events:none; box-shadow:none; border:1px solid #e2e8f0; background:transparent;">
                        <div class="rec-skeleton" style="width:70px; height:100px; margin:0; border-radius:8px; flex-shrink:0;"></div>
                        <div class="story-info" style="flex:1; width:100%;">
                            <div class="rec-skeleton" style="height:16px; width:70%; margin-bottom:10px;"></div>
                            <div class="rec-skeleton" style="height:12px; width:40%; margin-bottom:12px;"></div>
                            <div style="display:flex; gap:5px;">
                                <div class="rec-skeleton" style="height:20px; width:60px; border-radius:4px; margin:0;"></div>
                                <div class="rec-skeleton" style="height:20px; width:50px; border-radius:4px; margin:0;"></div>
                            </div>
                        </div>
                    </div>
                    `).join('')}
                </div>
            `;
        }

        function showSearchingSkeleton() {
            document.getElementById('default-view').style.display = 'none';
            const resView = document.getElementById('results-view');
            resView.style.display = 'block';
            resView.innerHTML = getSkeletonHTML();
        }

        function loadCachedStories() {
            try {
                const raw = localStorage.getItem(SEARCH_CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed.stories) ? parsed.stories : null;
            } catch (e) { return null; }
        }

        function saveSearchCache() {
            try {
                localStorage.setItem(SEARCH_CACHE_KEY, JSON.stringify({ stories: allStories, cachedAt: Date.now() }));
            } catch (e) { console.warn('Cache pencarian tidak tersimpan:', e); }
        }

        function isSearchableStory(data) {
            if (data.status === 'draft' || data.status === 'archived') return false;
            if (data.isDeleted === true || data.isBanned === true) return false;
            return true;
        }

        function extractTags(story) {
            if (!story.tags) return [];
            if (Array.isArray(story.tags)) return story.tags.filter(Boolean);
            if (typeof story.tags === 'string') return story.tags.split(',').map(t => t.trim()).filter(Boolean);
            return [];
        }

        async function loadStories() {
            try {
                const snap = await getDocs(collection(db, "published_stories"));
                let fresh = [];
                let authorIdsToFetch = new Set();

                snap.forEach(d => {
                    const sData = d.data();
                    if (!isSearchableStory(sData)) return;
                    fresh.push({ id: d.id, ...sData });
                    if (sData.authorId) authorIdsToFetch.add(sData.authorId);
                });

                await Promise.all([...authorIdsToFetch].map(async (uid) => {
                    try {
                        const uSnap = await getDoc(doc(db, "users", uid));
                        if (uSnap.exists()) {
                            const uData = uSnap.data();
                            authorCache[uid] = uData.username ? `@${uData.username}` : (uData.name || 'Anonim');
                        }
                    } catch (e) {}
                }));

                fresh.forEach(story => {
                    story.realAuthorName = authorCache[story.authorId] || story.authorName || 'Anonim';
                });

                allStories = fresh;
                saveSearchCache();
            } catch(e) {
                console.error("Gagal memuat database pencarian:", e);
            }
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('searchHistory')) || [];
            const container = document.getElementById('history-list');
            if(history.length === 0) { container.innerHTML = '<div style="font-size:0.85rem; color:#94a3b8; font-style:italic;">Belum ada riwayat pencarian.</div>'; return; }
            
            container.innerHTML = history.map(h => `<div class="history-chip" onclick="triggerSearch('${h}')"><i class="fa-solid fa-clock-rotate-left"></i> ${h}</div>`).join('');
        }
        
        window.clearHistory = () => { localStorage.removeItem('searchHistory'); loadHistory(); };

        window.triggerSearch = (val) => {
            document.getElementById('search-input').value = val;
            toggleClearButton();
            saveHistory(val);
            runSearchOrQueue(val.toLowerCase());
        };

        function saveHistory(term) {
            if(!term) return;
            let history = JSON.parse(localStorage.getItem('searchHistory')) || [];
            if(!history.includes(term)) { 
                history.unshift(term); 
                if(history.length > 5) history.pop(); 
                localStorage.setItem('searchHistory', JSON.stringify(history)); 
                loadHistory(); 
            }
        }

        function renderRecommendations() {
            const container = document.getElementById('recommend-list');

            if (allStories.length === 0) {
                container.innerHTML = '<div style="font-size:0.85rem; color:#94a3b8; font-style:italic;">Belum ada cukup karya untuk menyusun rekomendasi.</div>';
                return;
            }

            const genreCount = {};
            const tagCount = {};
            allStories.forEach(s => {
                const g = (s.genre || '').trim();
                if (g) genreCount[g] = (genreCount[g] || 0) + 1;
                extractTags(s).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; });
            });

            const topTags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 3)
                .map(([value, count]) => ({ type: 'tag', value, count }));
            const topGenres = Object.entries(genreCount).sort((a, b) => b[1] - a[1]).slice(0, 3)
                .map(([value, count]) => ({ type: 'genre', value, count }));

            const items = [...topTags, ...topGenres];
            if (items.length === 0) {
                container.innerHTML = '<div style="font-size:0.85rem; color:#94a3b8; font-style:italic;">Belum ada cukup karya untuk menyusun rekomendasi.</div>';
                return;
            }

            container.innerHTML = items.map(item => {
                const isTag = item.type === 'tag';
                const searchValue = isTag ? `#${item.value}` : item.value;
                const icon = isTag ? 'fa-hashtag' : 'fa-layer-group';
                const label = isTag ? `#${item.value}` : `${item.value} (Genre)`;
                return `
                    <div class="rec-item" onclick="triggerSearch('${searchValue.replace(/'/g, "\\'")}')">
                        <span class="rec-label"><i class="fa-solid ${icon}"></i> ${label}</span>
                        <span class="rec-count">${item.count} karya</span>
                    </div>
                `;
            }).join('');
        }

        window.clearSearchInput = () => {
            const input = document.getElementById('search-input');
            input.value = '';
            toggleClearButton();
            pendingQuery = null;
            document.getElementById('default-view').style.display = 'block';
            document.getElementById('results-view').style.display = 'none';
            try { window.history.replaceState(null, '', window.location.pathname); } catch(e) {}
            input.focus();
        };

        function toggleClearButton() {
            const val = document.getElementById('search-input').value.trim();
            document.getElementById('btn-clear-search').classList.toggle('show', val.length > 0);
        }

        function runSearchOrQueue(queryLower) {
            if (!dataReady) {
                pendingQuery = queryLower;
                showSearchingSkeleton();
                return;
            }
            executeSearch(queryLower);
        }

        document.getElementById('search-input').addEventListener('input', () => {
            toggleClearButton();
            const val = document.getElementById('search-input').value.trim();
            clearTimeout(searchTimer);
            pendingQuery = null;

            if (val === '') {
                document.getElementById('default-view').style.display = 'block';
                document.getElementById('results-view').style.display = 'none';
                try { window.history.replaceState(null, '', window.location.pathname); } catch(e) {}
                return;
            }

            searchTimer = setTimeout(() => { runSearchOrQueue(val.toLowerCase()); }, 400);
        });

        document.getElementById('search-input').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (val) saveHistory(val);
            }
        });

        // --- SISTEM PELACAK POIN TAGAR (+1 POIN SETIAP PENCARIAN) ---
        async function trackTagSearch(rawQuery, bestMatchingStory) {
            if (!rawQuery.startsWith('#')) return; // Hanya lacak yang pakai hashtag
            
            // Bersihkan tagar
            const cleanTag = rawQuery.replace(/[^a-zA-Z0-9]/g, '').trim().toLowerCase();
            if (!cleanTag || trackedTags.has(cleanTag)) return; // Jangan hitung dobel di 1 sesi
            
            trackedTags.add(cleanTag); // Tandai sudah dihitung

            try {
                const tagRef = doc(db, "tag_rankings", cleanTag);
                
                await runTransaction(db, async (transaction) => {
                    const tagDoc = await transaction.get(tagRef);
                    
                    if (!tagDoc.exists()) {
                        // Jika ini tagar baru, masukkan beserta profil cerita pertamanya
                        transaction.set(tagRef, {
                            tag: cleanTag,
                            dailyScore: 1,
                            weeklyScore: 1,
                            bestStoryId: bestMatchingStory ? bestMatchingStory.id : null,
                            bestStoryTitle: bestMatchingStory ? bestMatchingStory.title : null,
                            bestStoryAuthor: bestMatchingStory ? bestMatchingStory.realAuthorName : null,
                            bestStoryCover: bestMatchingStory ? bestMatchingStory.coverBase64 : null
                        });
                    } else {
                        // Jika sudah ada, tambahkan poinnya
                        const currentDaily = tagDoc.data().dailyScore || 0;
                        const currentWeekly = tagDoc.data().weeklyScore || 0;
                        
                        let updateData = {
                            dailyScore: currentDaily + 1,
                            weeklyScore: currentWeekly + 1
                        };

                        // Jika tagar ini belum punya "wajah cerita", tambahkan sekarang
                        if (!tagDoc.data().bestStoryId && bestMatchingStory) {
                            updateData.bestStoryId = bestMatchingStory.id;
                            updateData.bestStoryTitle = bestMatchingStory.title;
                            updateData.bestStoryAuthor = bestMatchingStory.realAuthorName;
                            updateData.bestStoryCover = bestMatchingStory.coverBase64;
                        }

                        transaction.update(tagRef, updateData);
                    }
                });
                console.log(`+1 Poin Peringkat untuk tagar #${cleanTag} tercatat!`);
            } catch (error) {
                console.error("Gagal mencatat poin tagar:", error);
            }
        }

        function executeSearch(queryText) {
            document.getElementById('default-view').style.display = 'none';
            const resView = document.getElementById('results-view');
            resView.style.display = 'block';

            if (queryText) {
                try {
                    window.history.replaceState(null, '', '?q=' + encodeURIComponent(queryText));
                } catch (e) {
                    console.warn("URL tidak dapat diubah di versi lokal (file:///). Proses tetap dilanjutkan.");
                }
            }

            const results = allStories.filter(story => {
                const safeTitle = (story.title || '').toLowerCase();
                const safeGenre = (story.genre || '').toLowerCase();
                const safeAuthor = (story.realAuthorName || '').toLowerCase(); 
                const tagsArray = extractTags(story);
                const safeTags = tagsArray.join(' ').toLowerCase();

                if (queryText.startsWith('#')) {
                    const tQuery = queryText.substring(1).trim().toLowerCase();
                    if(!tQuery) return false;
                    return tagsArray.some(t => t.toLowerCase().includes(tQuery));
                } else if (queryText.startsWith('@')) {
                    const aQuery = queryText.substring(1).trim().toLowerCase();
                    if(!aQuery) return false;
                    const cleanAuthorName = safeAuthor.replace('@', '');
                    return cleanAuthorName.includes(aQuery);
                } else {
                    return safeTitle.includes(queryText) || safeGenre.includes(queryText) || safeAuthor.includes(queryText) || safeTags.includes(queryText);
                }
            });

            if (results.length === 0) { 
                resView.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass-minus"></i><p>Maaf, tidak ada hasil untuk "<b>${queryText}</b>".<br>Coba gunakan kata kunci lain.</p></div>`; 
                return; 
            }

            // TRIGGER TRACKER: Jika pencarian berupa tagar dan ada hasilnya, tambahkan poin!
            if (queryText.startsWith('#')) {
                // Ambil cerita pertama di hasil pencarian untuk dijadikan 'wajah' dari tagar ini di klasemen
                const bestStory = results[0]; 
                trackTagSearch(queryText, bestStory);
            }

            let html = `<p class="result-count-label">${results.length} hasil ditemukan</p><div style="display:flex; flex-direction:column;">`;
            results.forEach(data => {
                const coverBg = data.coverBase64 ? `url('${data.coverBase64}')` : "none";
                const tagsArray = extractTags(data);
                let tagsHtml = tagsArray.length > 0 
                    ? tagsArray.slice(0,3).map(t => `<span style="font-size:0.65rem; color:var(--primary); background:#f1f5f9; padding:2px 8px; border-radius:4px; border: 1px solid #cbd5e1; font-weight:600;">#${t}</span>`).join('') 
                    : '';
                
                html += `
                    <div class="story-card" onclick="window.location.href='pratinjau.html?id=${data.id}'">
                        <div class="story-cover" style="background-image: ${coverBg};"></div>
                        <div class="story-info">
                            <h4>${data.title || 'Tanpa Judul'}</h4>
                            <p><i class="fa-solid fa-at"></i> ${data.realAuthorName}</p>
                            <div class="story-tags-wrap">
                                <span style="font-size:0.7rem; background:var(--gold); padding:2px 8px; border-radius:4px; font-weight:700; color:white;">${data.genre || 'Umum'}</span>
                                ${tagsHtml}
                            </div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            resView.innerHTML = html;
        }

        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            let queryFromUrl = urlParams.get('q');
            
            if (!queryFromUrl && window.location.hash) {
                queryFromUrl = window.location.hash;
            } else if (queryFromUrl && window.location.hash) {
                queryFromUrl = queryFromUrl + window.location.hash; 
            }
            if (queryFromUrl) queryFromUrl = decodeURIComponent(queryFromUrl).toLowerCase();

            const cached = loadCachedStories();
            if (cached && cached.length > 0) {
                allStories = cached;
                dataReady = true;
                renderRecommendations();
                loadHistory();
                if (queryFromUrl) {
                    document.getElementById('search-input').value = queryFromUrl;
                    toggleClearButton();
                    saveHistory(queryFromUrl);
                    executeSearch(queryFromUrl);
                }
            } else {
                loadHistory();
                if (queryFromUrl) {
                    document.getElementById('search-input').value = queryFromUrl;
                    toggleClearButton();
                    pendingQuery = queryFromUrl;
                    showSearchingSkeleton();
                }
            }

            await loadStories();
            dataReady = true;
            renderRecommendations();

            if (pendingQuery !== null) {
                const q = pendingQuery;
                pendingQuery = null;
                executeSearch(q);
            } else {
                const currentVal = document.getElementById('search-input').value.trim();
                if (currentVal) executeSearch(currentVal.toLowerCase());
            }
        }

        initApp();
    </script>
</body>
</html>
