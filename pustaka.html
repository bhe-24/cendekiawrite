<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pustaka Saya - Aksara Narasi</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512x512.png">
    <link rel="apple-touch-icon" href="/assets/icon-192x192.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* --- 1. GLOBAL & COLORS --- */
        :root {
            --nav-bg: #0f172a;       
            --primary: #003366;      
            --gold: #d4af37;         
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0; padding: 0;
            padding-top: 60px; /* SINKRONISASI TINGGI NAVBAR */
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- 2. RESPONSIVE FULL DESKTOP WRAPPER --- */
        .app-wrapper {
            width: 100%;
            max-width: 1280px; 
            margin: 0 auto;
            background-color: transparent;
            flex: 1;
            display: flex; flex-direction: column;
            position: relative;
        }

        .content-bg {
            background-color: white;
            flex: 1; display: flex; flex-direction: column;
            min-height: calc(100vh - 60px);
        }

        @media (min-width: 768px) {
            body { background-color: #e2e8f0; } 
            .content-bg { 
                border-left: 1px solid #cbd5e1; 
                border-right: 1px solid #cbd5e1; 
                box-shadow: 0 0 40px rgba(0,0,0,0.05); 
            }
        }

        /* --- 3. FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            display: flex; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .navbar-content {
            width: 100%; max-width: 1280px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; height: 100%;
        }

        .btn-back {
            background: none; border: none; color: white;
            font-size: 1.2rem; cursor: pointer; transition: 0.2s;
            text-decoration: none; display: flex; align-items: center;
            height: 100%;
        }
        .btn-back:hover { color: var(--gold); }

        .nav-brand { display: flex; align-items: center; gap: 10px; margin: 0 auto; transform: translateX(-10px);}
        .nav-brand h1 { font-family: 'Aleo', serif; font-size: 1.2rem; color: white; margin: 0; letter-spacing: 0.5px; }

        /* --- 4. TABS NAVIGATION --- */
        .tab-container {
            display: flex; background: white; padding: 10px 20px 0 20px;
            border-bottom: 1px solid #e2e8f0; position: sticky; top: 60px; z-index: 99;
        }
        .tab-btn {
            flex: 1; text-align: center; padding: 12px 0;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 600;
            color: var(--text-gray); cursor: pointer; border-bottom: 3px solid transparent;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: var(--primary); border-bottom-color: var(--primary);
        }

        /* --- 5. LIBRARY LIST CONTENT --- */
        .content-area {
            padding: 20px; flex: 1; display: none; flex-direction: column; gap: 15px;
            animation: fadeIn 0.3s ease;
        }
        .content-area.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* SISTEM GRID BUKU (RESPONSIVE) */
        .list-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        @media (min-width: 640px) { .list-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } .content-area { padding: 30px; } }
        @media (min-width: 1024px) { .list-grid { grid-template-columns: repeat(3, 1fr); gap: 25px; } .content-area { padding: 40px; } }

        .library-card {
            display: flex; gap: 12px; background: white; padding: 15px;
            border-radius: 16px; border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.3s; position: relative;
            cursor: pointer; height: 100%; /* Memastikan tinggi sama di dalam grid */
        }
        .library-card:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(0,0,0,0.08); transform: translateY(-3px); }

        .story-cover {
            width: 75px; height: 110px; border-radius: 8px;
            background-color: #cbd5e1; background-size: cover; background-position: center;
            flex-shrink: 0; border: 1px solid #e2e8f0;
        }

        .story-info {
            display: flex; flex-direction: column; flex: 1; overflow: hidden;
        }
        .story-info h3 {
            font-size: 1.05rem; font-weight: 700; color: var(--primary);
            margin: 0 0 5px 0; line-height: 1.2; padding-right: 25px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .story-info .author {
            font-size: 0.8rem; color: var(--text-gray); margin: 0 0 10px 0;
            display: flex; align-items: center; gap: 6px;
        }
        
        .progress-container { margin-bottom: 12px; }
        .progress-label { font-size: 0.7rem; color: var(--primary); font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between;}
        .progress-bar { width: 100%; height: 5px; background: #e2e8f0; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); }

        /* Aksi Kartu Lanjut Baca */
        .card-actions { display: flex; gap: 8px; margin-top: auto;}
        .btn-action {
            flex: 1; padding: 8px 0; border-radius: 8px; border: none;
            font-family: 'Poppins'; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-read { background: var(--gold); color: white; }
        .btn-read:hover { background: #b45309; }

        /* --- MENU 3 TITIK (DROPDOWN) --- */
        .card-menu-btn {
            position: absolute; top: 12px; right: 10px; background: none; border: none;
            font-size: 1.2rem; color: #94a3b8; cursor: pointer; padding: 5px 10px; transition: 0.2s;
            z-index: 2;
        }
        .card-menu-btn:hover { color: var(--primary); }
        .card-dropdown {
            position: absolute; top: 45px; right: 15px; background: white; border: 1px solid #e2e8f0;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 180px;
            display: none; flex-direction: column; z-index: 10; overflow: hidden;
        }
        .card-dropdown.active { display: flex; animation: dropFade 0.2s ease; }
        @keyframes dropFade { from { opacity:0; transform: translateY(-10px); } to { opacity:1; transform: translateY(0); } }
        
        .card-dropdown button {
            padding: 12px 15px; background: none; border: none; text-align: left; font-family: 'Poppins';
            font-size: 0.85rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 10px;
            color: var(--text-dark); transition: 0.2s; border-bottom: 1px solid #f1f5f9;
        }
        .card-dropdown button:last-child { border-bottom: none; }
        .card-dropdown button:hover { background: #f8fafc; color: var(--primary); }
        .card-dropdown button.text-danger { color: #dc2626; }
        .card-dropdown button.text-danger:hover { background: #fef2f2; }

        /* Info Box Arsip */
        .info-box {
            background: #fffbeb; border: 1px solid #fde68a; padding: 15px; border-radius: 12px;
            display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px;
        }
        .info-box i { color: #d97706; font-size: 1.2rem; margin-top: 2px;}
        .info-box p { margin: 0; font-size: 0.8rem; color: #92400e; line-height: 1.5;}

        /* EMPTY STATE */
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: #94a3b8; border: 2px dashed #cbd5e1; border-radius: 16px; margin-top: 20px;}
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: #cbd5e1; }
        .empty-state p { margin: 0; font-size: 0.95rem; }

        /* --- SKELETON SHIMMER INSTANT LOAD --- */
        @keyframes skeleton-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        .sk-card { display: flex; gap: 12px; background: white; padding: 15px; border-radius: 16px; border: 1px solid #e2e8f0; height: 100%;}
        .sk-cover, .sk-line { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 37%, #e2e8f0 63%); background-size: 400% 100%; animation: skeleton-shimmer 1.4s ease infinite; }
        .sk-cover { width: 75px; height: 110px; border-radius: 8px; flex-shrink: 0; }
        .sk-line { height: 12px; border-radius: 6px; margin-bottom: 8px; }
        .sk-line.short { width: 60%; }
        
        /* Hilangkan elemen skeleton ke-3 di HP agar rapi, tampilkan di grid PC */
        @media (max-width: 639px) { .sk-card.desktop-only { display: none; } }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="content-bg">
            <!-- NAVBAR -->
            <header class="top-navbar">
                <div class="navbar-content">
                    <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
                    <div class="nav-brand">
                        <h1>Pustaka Saya</h1>
                    </div>
                    <div style="width: 24px;"></div> <!-- Spacer -->
                </div>
            </header>

            <!-- TABS -->
            <div class="tab-container">
                <div class="tab-btn active" onclick="switchTab('bacaan')">Daftar Bacaan</div>
                <div class="tab-btn" onclick="switchTab('arsip')">Arsip Buku</div>
            </div>

            <!-- TAB CONTENT: DAFTAR BACAAN -->
            <div class="content-area active" id="tab-bacaan">
                <div id="bacaan-skeleton" class="list-grid">
                    <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line" style="margin-top:20px;"></div></div></div>
                    <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line" style="margin-top:20px;"></div></div></div>
                    <div class="sk-card desktop-only"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line"></div><div class="sk-line short"></div><div class="sk-line" style="margin-top:20px;"></div></div></div>
                </div>
                <div id="bacaan-list" class="list-grid"></div>
            </div>

            <!-- TAB CONTENT: ARSIP BUKU -->
            <div class="content-area" id="tab-arsip">
                <div class="info-box">
                    <i class="fa-solid fa-box-archive"></i>
                    <p><b>Akses Diputus:</b> Cerita yang berada di arsip ini tidak akan muncul di rekomendasi utama dan algoritma kami akan berhenti menyarankan genre serupa kepada Anda.</p>
                </div>
                
                <div id="arsip-skeleton" class="list-grid">
                    <div class="sk-card"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
                    <div class="sk-card desktop-only"><div class="sk-cover"></div><div style="flex:1"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
                </div>
                <div id="arsip-list" class="list-grid"></div>
            </div>
        </div>
    </div>

    <!-- Script SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- RENDER INSTAN DARI CACHE LOKAL -->
    <script>
        (function() {
            // Ambil UID user dari localStorage yang disimpan saat login/akses profil
            const uid = localStorage.getItem('cendekia_last_uid');
            if(!uid) return;
            try {
                const raw = localStorage.getItem('cendekia_pustaka_cache_' + uid);
                if(raw) {
                    const data = JSON.parse(raw);
                    if(data.bacaanHtml) {
                        document.getElementById('bacaan-list').innerHTML = data.bacaanHtml;
                        document.getElementById('bacaan-skeleton').style.display = 'none';
                    }
                    if(data.arsipHtml) {
                        document.getElementById('arsip-list').innerHTML = data.arsipHtml;
                        document.getElementById('arsip-skeleton').style.display = 'none';
                    }
                }
            } catch(e) {}
        })();

        // Sistem Toggle Dropdown (3 Titik)
        window.toggleMenu = (docId, event) => {
            event.stopPropagation(); // Cegah merembes klik ke kartu
            
            // Tutup dropdown lain yang sedang terbuka
            document.querySelectorAll('.card-dropdown').forEach(menu => {
                if (menu.id !== `menu-${docId}`) menu.classList.remove('active');
            });
            
            // Toggle dropdown yang diklik
            const menu = document.getElementById(`menu-${docId}`);
            if (menu) menu.classList.toggle('active');
        };

        // Tutup semua dropdown jika mengklik tempat lain di layar
        document.addEventListener('click', () => {
            document.querySelectorAll('.card-dropdown').forEach(menu => menu.classList.remove('active'));
        });

        // Navigasi ke halaman baca atau lapor
        window.goToStory = (url, event) => {
            event.stopPropagation();
            window.location.href = url;
        };
    </script>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Konfigurasi Database Aksara Narasi
        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUserUid = null;
        let libraryItems = [];
        let authorCache = {}; 
        let storyCache = {}; 

        // 1. Cek Status Login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                localStorage.setItem('cendekia_last_uid', user.uid);
                fetchLibrary();
            } else {
                Swal.fire({
                    title: 'Akses Ditolak',
                    text: 'Silakan masuk ke akun Anda terlebih dahulu untuk membuka pustaka.',
                    icon: 'warning',
                    confirmButtonColor: '#003366',
                    allowOutsideClick: false
                }).then(() => {
                    window.location.href = 'login.html';
                });
            }
        });

        // 2. Tab Switcher
        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-area').forEach(area => area.classList.remove('active'));
            
            if(tabName === 'bacaan') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-bacaan').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-arsip').classList.add('active');
            }
        };

        function savePustakaCache(bacaanHtml, arsipHtml) {
            if(!currentUserUid) return;
            try {
                localStorage.setItem('cendekia_pustaka_cache_' + currentUserUid, JSON.stringify({ bacaanHtml, arsipHtml, cachedAt: Date.now() }));
            } catch(e) {}
        }

        // 3. Ambil Data Pustaka User & PENGECEKAN KEBERSIHAN KONTEN (SILENT DELETION)
        async function fetchLibrary() {
            try {
                const q = query(collection(db, "users", currentUserUid, "library"));
                const snap = await getDocs(q);
                
                let rawItems = [];
                snap.forEach(docSnap => {
                    rawItems.push({ docId: docSnap.id, ...docSnap.data() });
                });

                rawItems.sort((a, b) => {
                    let timeA = a.addedAt ? a.addedAt.toMillis() : 0;
                    let timeB = b.addedAt ? b.addedAt.toMillis() : 0;
                    return timeB - timeA; 
                });

                libraryItems = [];
                const nowMs = Date.now();
                const SIXTY_DAYS_MS = 60 * 24 * 60 * 60 * 1000;

                // Loop cek silang ke database utama
                for (let i = 0; i < rawItems.length; i++) {
                    let item = rawItems[i];
                    let realAuthorName = 'Anonim';
                    let shouldBeSilentlyDeleted = false;

                    // A. Cek Umur Tidak Dibaca (> 60 Hari)
                    if (item.lastReadAt) {
                        const lastReadMs = item.lastReadAt.toMillis();
                        if (nowMs - lastReadMs > SIXTY_DAYS_MS) {
                            shouldBeSilentlyDeleted = true;
                        }
                    } else if (item.addedAt) {
                        const addedMs = item.addedAt.toMillis();
                        if (nowMs - addedMs > SIXTY_DAYS_MS) {
                            shouldBeSilentlyDeleted = true;
                        }
                    }

                    // B. Cek Ketersediaan & Status Cerita di Database Utama
                    if (!shouldBeSilentlyDeleted && item.storyId) {
                        let storyExistsAndSafe = false;

                        if (!storyCache[item.storyId]) {
                            try {
                                const storySnap = await getDoc(doc(db, "published_stories", item.storyId));
                                if (storySnap.exists()) {
                                    storyCache[item.storyId] = storySnap.data();
                                } else {
                                    // Coba cari di folder draf jika belum rilis publik
                                    const draftSnap = await getDoc(doc(db, "stories", item.storyId));
                                    if (draftSnap.exists()) {
                                        storyCache[item.storyId] = draftSnap.data();
                                    }
                                }
                            } catch(e) { console.error(e); }
                        }

                        const storyData = storyCache[item.storyId];
                        
                        if (storyData) {
                            // Proteksi Konten Ultra Ketat (Banned / Dihapus / Draft / Ditolak)
                            if (storyData.isBanned === true || 
                                storyData.isDeleted === true || 
                                storyData.status === 'draft' || 
                                storyData.status === 'archived' ||
                                storyData.status === 'rejected') {
                                shouldBeSilentlyDeleted = true;
                            } else {
                                storyExistsAndSafe = true;

                                // Ambil nama asli jika cerita aman
                                realAuthorName = storyData.authorName || 'Anonim';
                                const authorId = storyData.authorId;

                                if (authorId) {
                                    if (!authorCache[authorId]) {
                                        try {
                                            const authorSnap = await getDoc(doc(db, "users", authorId));
                                            if (authorSnap.exists()) {
                                                const uData = authorSnap.data();
                                                authorCache[authorId] = uData.username ? `@${uData.username}` : (uData.name || realAuthorName);
                                            }
                                        } catch(e) {}
                                    }
                                    if (authorCache[authorId]) {
                                        realAuthorName = authorCache[authorId];
                                    }
                                }
                            }
                        }

                        if (!storyExistsAndSafe) {
                            shouldBeSilentlyDeleted = true;
                        }
                    }

                    // EKSEKUSI PENGHAPUSAN DIAM-DIAM JIKA MELANGGAR/KADALUWARSA
                    if (shouldBeSilentlyDeleted) {
                        try {
                            await deleteDoc(doc(db, "users", currentUserUid, "library", item.docId));
                        } catch(e) {}
                    } else {
                        // Cerita lolos inspeksi, masukkan ke UI
                        item.realAuthorName = realAuthorName;
                        libraryItems.push(item);
                    }
                }

                // Sembunyikan skeleton
                document.getElementById('bacaan-skeleton').style.display = 'none';
                document.getElementById('arsip-skeleton').style.display = 'none';
                
                renderLibrary();

            } catch (error) {
                console.error("Gagal menarik data pustaka:", error);
                Swal.fire('Error', 'Gagal memuat pustaka buku Anda.', 'error');
            }
        }

        // 4. Render ke Layar
        function renderLibrary() {
            const bacaanContainer = document.getElementById('bacaan-list');
            const arsipContainer = document.getElementById('arsip-list');
            
            let bacaanHtml = '';
            let arsipHtml = '';

            libraryItems.forEach(item => {
                const coverBg = item.coverBase64 ? `url('${item.coverBase64}')` : "none";
                const progress = item.progressPercentage || 0;
                
                // --- STRUKTUR KARTU & DROPDOWN ---
                const dropdownHtml = item.isArchived 
                    ? `<button onclick="unarchiveStory('${item.docId}', event)"><i class="fa-solid fa-rotate-left"></i> Pulihkan</button>
                       <button class="text-danger" onclick="removeStory('${item.docId}', event)"><i class="fa-solid fa-trash"></i> Hapus Permanen</button>
                       <button class="text-danger" onclick="goToStory('lapor.html?type=story&id=${item.storyId}', event)"><i class="fa-solid fa-flag"></i> Laporkan Cerita</button>`
                    
                    : `<button onclick="archiveStory('${item.docId}', event)"><i class="fa-solid fa-box-archive"></i> Arsipkan</button>
                       <button class="text-danger" onclick="removeStory('${item.docId}', event)"><i class="fa-solid fa-trash"></i> Hapus Cerita</button>
                       <button class="text-danger" onclick="goToStory('lapor.html?type=story&id=${item.storyId}', event)"><i class="fa-solid fa-flag"></i> Laporkan Cerita</button>`;

                const cardHtml = `
                    <div class="library-card" onclick="window.location.href='pratinjau.html?id=${item.storyId}'">
                        <button class="card-menu-btn" onclick="toggleMenu('${item.docId}', event)"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                        
                        <div class="card-dropdown" id="menu-${item.docId}">
                            ${dropdownHtml}
                        </div>

                        <div class="story-cover" style="background-image: ${coverBg}; ${item.isArchived ? 'filter: grayscale(100%);' : ''}"></div>
                        <div class="story-info">
                            <h3 style="${item.isArchived ? 'color:var(--text-gray);' : ''}">${item.title}</h3>
                            <p class="author"><i class="fa-solid fa-pen-nib"></i> ${item.realAuthorName}</p>
                            
                            ${!item.isArchived ? `
                            <div class="progress-container">
                                <div class="progress-label"><span>Progres Baca</span> <span>${progress}%</span></div>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%;"></div></div>
                            </div>
                            <div class="card-actions">
                                <button class="btn-action btn-read" onclick="goToStory('read.html?id=${item.storyId}', event)"><i class="fa-solid fa-book-open"></i> Lanjut Baca</button>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;

                if (item.isArchived) {
                    arsipHtml += cardHtml;
                } else {
                    bacaanHtml += cardHtml;
                }
            });

            // Handle Empty States
            if (bacaanHtml === '') {
                bacaanHtml = `
                    <div class="empty-state">
                        <i class="fa-solid fa-book-bookmark"></i>
                        <p>Daftar bacaan Anda masih kosong.<br>Jelajahi cerita menarik di beranda!</p>
                    </div>
                `;
            }
            if (arsipHtml === '') {
                arsipHtml = `
                    <div class="empty-state">
                        <i class="fa-solid fa-box-open"></i>
                        <p>Tidak ada cerita yang diarsipkan.</p>
                    </div>
                `;
            }

            bacaanContainer.innerHTML = bacaanHtml;
            arsipContainer.innerHTML = arsipHtml;

            // Simpan cache lokal untuk instant-load
            savePustakaCache(bacaanHtml, arsipHtml);
        }

        // 5. Aksi Database: Arsipkan Cerita
        window.archiveStory = async (docId, event) => {
            event.stopPropagation(); // Cegah merembes ke pratinjau cerita
            document.querySelectorAll('.card-dropdown').forEach(m => m.classList.remove('active'));

            const konfirmasi = await Swal.fire({
                title: 'Arsipkan Cerita Ini?',
                html: 'Cerita ini akan dipindahkan ke tab Arsip.<br><b>Algoritma kami juga akan berhenti merekomendasikan karya serupa kepada Anda.</b>',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d97706',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Arsipkan',
                cancelButtonText: 'Batal'
            });

            if(konfirmasi.isConfirmed) {
                try {
                    await updateDoc(doc(db, "users", currentUserUid, "library", docId), {
                        isArchived: true,
                        archivedAt: new Date().toISOString()
                    });
                    
                    const item = libraryItems.find(x => x.docId === docId);
                    if(item) item.isArchived = true;
                    renderLibrary();
                    
                    Swal.fire({ icon: 'success', title: 'Diarsipkan', timer: 1500, showConfirmButton: false });
                } catch(e) {
                    Swal.fire('Error', 'Gagal mengarsipkan cerita.', 'error');
                }
            }
        };

        // 6. Aksi Database: Pulihkan Arsip
        window.unarchiveStory = async (docId, event) => {
            event.stopPropagation();
            document.querySelectorAll('.card-dropdown').forEach(m => m.classList.remove('active'));

            try {
                await updateDoc(doc(db, "users", currentUserUid, "library", docId), {
                    isArchived: false,
                    archivedAt: null
                });
                
                const item = libraryItems.find(x => x.docId === docId);
                if(item) item.isArchived = false;
                renderLibrary();
                
                Swal.fire({ icon: 'success', title: 'Dipulihkan', text: 'Cerita kembali ke daftar bacaan.', timer: 1500, showConfirmButton: false });
            } catch(e) {
                Swal.fire('Error', 'Gagal memulihkan cerita.', 'error');
            }
        };

        // 7. Aksi Database: Hapus Permanen dari Pustaka
        window.removeStory = async (docId, event) => {
            event.stopPropagation();
            document.querySelectorAll('.card-dropdown').forEach(m => m.classList.remove('active'));

            const konfirmasi = await Swal.fire({
                title: 'Hapus dari Pustaka?',
                text: 'Cerita ini akan dihapus secara permanen dari daftar pustaka Anda.',
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Hapus',
                cancelButtonText: 'Batal'
            });

            if(konfirmasi.isConfirmed) {
                try {
                    await deleteDoc(doc(db, "users", currentUserUid, "library", docId));
                    
                    libraryItems = libraryItems.filter(x => x.docId !== docId);
                    renderLibrary();
                    
                    Swal.fire({ icon: 'success', title: 'Dihapus', timer: 1500, showConfirmButton: false });
                } catch(e) {
                    Swal.fire('Error', 'Gagal menghapus cerita.', 'error');
                }
            }
        };
    </script>
</body>
</html>
