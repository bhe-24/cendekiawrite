<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Karya - Aksara Narasi</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512x512.png">
    <link rel="apple-touch-icon" href="/assets/icon-192x192.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* --- 1. GLOBAL & COLORS --- */
        :root {
            --nav-bg: #0f172a;       
            --primary: #003366;      
            --gold: #d4af37;         
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0; padding: 0;
            padding-top: 60px; /* SINKRONISASI TINGGI NAVBAR */
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- 2. RESPONSIVE FULL DESKTOP WRAPPER --- */
        .app-wrapper {
            width: 100%;
            max-width: 1280px; 
            margin: 0 auto;
            background-color: transparent;
            flex: 1;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* Background putih untuk konten di layar besar */
        .content-bg {
            background-color: white;
            flex: 1; display: flex; flex-direction: column;
        }

        @media (min-width: 768px) {
            body { background-color: #e2e8f0; } 
            .content-bg { 
                border-left: 1px solid #cbd5e1; 
                border-right: 1px solid #cbd5e1; 
                box-shadow: 0 0 40px rgba(0,0,0,0.05); 
            }
        }

        /* --- 3. FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; 
            height: 60px; /* DIKUNCI 60PX AGAR TIDAK MISMATCH */
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            display: flex; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        .navbar-content {
            width: 100%; max-width: 1280px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            height: 100%;
        }

        .btn-back {
            background: none; border: none; color: white;
            font-size: 1.2rem; cursor: pointer; transition: 0.2s;
            text-decoration: none; display: flex; align-items: center;
            height: 100%;
        }
        .btn-back:hover { color: var(--gold); }

        .nav-brand { display: flex; align-items: center; gap: 10px; margin: 0 auto; transform: translateX(-10px);}
        .nav-brand h1 { font-family: 'Aleo', serif; font-size: 1.1rem; color: white; margin: 0; letter-spacing: 0.5px; }

        /* --- 4. HERO BANNER GENRE --- */
        .genre-hero {
            background: linear-gradient(135deg, var(--primary) 0%, #0f172a 100%);
            padding: 40px 20px; text-align: center; color: white;
            position: relative; overflow: hidden; margin-top: 0; /* Menghilangkan celah putih */
        }
        .genre-hero::after {
            content: '\f5fd'; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: -10px; bottom: -20px; font-size: 8rem;
            color: rgba(255, 255, 255, 0.05); pointer-events: none; transform: rotate(-15deg);
        }
        .genre-hero h2 {
            font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin: 0 0 5px 0; color: var(--gold); position: relative; z-index: 2;
        }
        .genre-hero p {
            font-size: clamp(0.85rem, 2vw, 1rem); color: #cbd5e1; margin: 0; position: relative; z-index: 2;
        }

        /* --- 5. STORY LIST (RESPONSIVE GRID) --- */
        .story-list-container {
            padding: 20px;
            flex: 1;
            position: relative;
        }

        #stories-grid {
            display: grid;
            grid-template-columns: 1fr; /* Di HP: 1 Kolom berbaris ke bawah */
            gap: 15px;
        }

        /* Tablet & Laptop: Berubah jadi Grid 2 atau 3 Kolom */
        @media (min-width: 640px) {
            #stories-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .story-list-container { padding: 30px; }
        }
        @media (min-width: 1024px) {
            #stories-grid { grid-template-columns: repeat(3, 1fr); gap: 25px; }
            .story-list-container { padding: 40px; }
        }

        .story-card-list {
            display: flex; gap: 15px; background: white; padding: 15px;
            border-radius: 16px; border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer;
            transition: 0.3s;
        }
        .story-card-list:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }

        .story-cover {
            width: 80px; height: 120px; border-radius: 8px;
            background-color: #cbd5e1; background-size: cover; background-position: center;
            flex-shrink: 0; border: 1px solid #e2e8f0;
        }

        .story-info {
            display: flex; flex-direction: column; justify-content: center; flex: 1; overflow: hidden;
        }
        .story-info h3 {
            font-size: 1.05rem; font-weight: 700; color: var(--primary);
            margin: 0 0 5px 0; line-height: 1.2;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .story-info .author {
            font-size: 0.8rem; color: var(--text-gray); margin: 0 0 8px 0;
            display: flex; align-items: center; gap: 6px;
        }
        
        .story-meta-row {
            display: flex; align-items: center; gap: 12px;
            font-size: 0.75rem; color: var(--text-gray); font-weight: 600;
        }
        .story-meta-row span { display: flex; align-items: center; gap: 4px; }
        
        .synopsis {
            font-size: 0.75rem; color: #94a3b8; margin: 8px 0 0 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            line-height: 1.4;
        }

        /* LOADING & EMPTY STATE */
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: #94a3b8; border: 2px dashed #cbd5e1; border-radius: 16px; margin-top: 10px; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: #cbd5e1; }
        .empty-state p { margin: 0; font-size: 0.95rem; }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 500; display: flex; flex-direction: column;
            justify-content: center; align-items: center; border-radius: 16px;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e2e8f0;
            border-top-color: var(--gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>

    <!-- SCRIPT INSTANT-LOAD TAMPILAN AWAL -->
    <script>
        (function () {
            // Ambil parameter genre dari URL dengan sangat cepat sebelum DOM selesai diload
            var urlParams = new URLSearchParams(window.location.search);
            var genreQuery = urlParams.get('genre');
            
            // Jika ada genre yang dipilih, tampilkan langsung di kerangka HTML
            if (genreQuery) {
                document.write('<style>#navbar-title { display: none; } #hero-genre-name { content: "Kategori: ' + genreQuery + '"; }</style>');
                document.addEventListener("DOMContentLoaded", function() {
                    document.getElementById('navbar-title').innerText = genreQuery;
                    document.getElementById('navbar-title').style.display = 'block';
                    document.getElementById('hero-genre-name').innerText = 'Kategori: ' + genreQuery;
                });
            }
        })();
    </script>
</head>
<body>

    <div class="app-wrapper">
        <div class="content-bg">
            <!-- NAVBAR -->
            <header class="top-navbar">
                <div class="navbar-content">
                    <a href="genre.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
                    <div class="nav-brand">
                        <h1 id="navbar-title">Daftar Karya</h1>
                    </div>
                    <div style="width: 24px;"></div> <!-- Spacer -->
                </div>
            </header>

            <!-- HERO BANNER GENRE -->
            <div class="genre-hero">
                <h2 id="hero-genre-name">Memuat...</h2>
                <p id="hero-genre-count">Menyiapkan daftar cerita</p>
            </div>

            <!-- AREA LIST CERITA -->
            <div class="story-list-container" id="story-list-container">
                
                <div id="loading-overlay">
                    <div class="spinner"></div>
                    <div style="color: var(--primary); font-weight: 500; font-size: 0.95rem;">Menarik data dari rak buku...</div>
                </div>

                <div id="stories-grid">
                    <!-- Akan diisi otomatis oleh JavaScript -->
                </div>
                
            </div>
        </div>
    </div>

    <!-- Script SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Database Aksara Narasi
        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Mengambil Parameter Genre dari URL (?genre=Romansa)
        const urlParams = new URLSearchParams(window.location.search);
        let selectedGenre = urlParams.get('genre') || 'Umum';

        async function fetchStoriesByGenre() {
            try {
                // Tarik semua cerita (diurutkan berdasarkan views tertinggi)
                const q = query(collection(db, "published_stories"), orderBy("views", "desc"));
                const snap = await getDocs(q);
                
                let filteredStories = [];
                let authorIdsToFetch = new Set();

                snap.forEach(doc => {
                    const data = { id: doc.id, ...doc.data() };
                    
                    // --- PROTEKSI KETAT (LEGAL & PRIVASI) ---
                    if (data.status === 'draft' || 
                        data.status === 'archived' || 
                        data.isDeleted === true || 
                        data.isBanned === true) {
                        return; 
                    }
                    
                    // Standarisasi pembacaan nama genre dari database
                    let dbGenreName = data.genre ? data.genre.trim() : "Umum";
                    dbGenreName = dbGenreName.charAt(0).toUpperCase() + dbGenreName.slice(1).toLowerCase();

                    // Jika cocok dengan genre yang dipilih, masukkan ke array
                    if (dbGenreName === selectedGenre) {
                        filteredStories.push(data);
                        if(data.authorId) authorIdsToFetch.add(data.authorId);
                    }
                });

                // Melacak Profil Penulis Asli
                let authorCache = {};
                for (let uid of authorIdsToFetch) {
                    try {
                        const uSnap = await getDoc(doc(db, "users", uid));
                        if(uSnap.exists()) {
                            const uData = uSnap.data();
                            // Jika punya username gunakan @username, jika tidak gunakan nama, jika tidak gunakan Anonim
                            authorCache[uid] = uData.username ? `@${uData.username}` : (uData.name || 'Anonim');
                        }
                    } catch(e) { console.warn("Gagal menarik data user:", uid); }
                }

                // Terapkan nama asli ke dalam array cerita
                filteredStories = filteredStories.map(story => {
                    return {
                        ...story,
                        realAuthorName: authorCache[story.authorId] || story.authorName || 'Anonim'
                    };
                });

                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('hero-genre-count').innerText = `Ditemukan ${filteredStories.length} cerita menakjubkan`;

                renderStoryList(filteredStories);

            } catch (error) {
                console.error("Gagal menarik data cerita:", error);
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('hero-genre-count').innerText = "Terjadi kesalahan";
                document.getElementById('stories-grid').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <p>Gagal memuat daftar cerita.<br>Periksa koneksi internet Anda.</p>
                    </div>
                `;
            }
        }

        function renderStoryList(stories) {
            const container = document.getElementById('stories-grid');
            container.innerHTML = '';

            if (stories.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-book-open-reader"></i>
                        <p>Belum ada karya yang diterbitkan dalam genre <b>${selectedGenre}</b>.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            stories.forEach(data => {
                const coverBg = data.coverBase64 ? `url('${data.coverBase64}')` : "none";
                const synopsisText = data.synopsis ? data.synopsis : "Penulis belum mencantumkan sinopsis untuk cerita ini.";
                
                html += `
                    <div class="story-card-list" onclick="window.location.href='pratinjau.html?id=${data.id}'">
                        <div class="story-cover" style="background-image: ${coverBg};"></div>
                        <div class="story-info">
                            <h3>${data.title}</h3>
                            <p class="author"><i class="fa-solid fa-pen-nib"></i> ${data.realAuthorName}</p>
                            <div class="story-meta-row">
                                <span><i class="fa-solid fa-eye"></i> ${data.views || 0}</span>
                                <span><i class="fa-solid fa-star" style="color:var(--gold)"></i> ${data.votes || 0}</span>
                                ${data.progressStatus === 'completed' ? '<span style="color:#10b981;"><i class="fa-solid fa-check-circle"></i> Tamat</span>' : '<span style="color:#0ea5e9;"><i class="fa-solid fa-feather-pointed"></i> On-Going</span>'}
                            </div>
                            <p class="synopsis">${synopsisText}</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Tarik data saat halaman dibuka
        window.onload = () => {
            fetchStoriesByGenre();
        };
    </script>
</body>
</html>
