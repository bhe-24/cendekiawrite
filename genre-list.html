<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Karya - Cendekia Aksara</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* --- 1. GLOBAL & COLORS --- */
        :root {
            --nav-bg: #0f172a;       
            --primary: #003366;      
            --gold: #d4af37;         
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0; padding: 0;
            padding-top: 60px; 
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- 2. MOBILE FIRST WRAPPER --- */
        .app-wrapper {
            width: 100%;
            max-width: 480px; 
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
            display: flex; flex-direction: column;
            position: relative;
        }

        @media (min-width: 768px) {
            body { background-color: #e2e8f0; } 
            .app-wrapper { border-left: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; box-shadow: 0 0 40px rgba(0,0,0,0.1); }
            .top-navbar { max-width: 480px; left: 50% !important; transform: translateX(-50%); }
        }

        /* --- 3. FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .btn-back {
            background: none; border: none; color: white;
            font-size: 1.2rem; cursor: pointer; transition: 0.2s;
            text-decoration: none; display: flex; align-items: center;
        }
        .btn-back:hover { color: var(--gold); }

        .nav-brand { display: flex; align-items: center; gap: 10px; margin: 0 auto; transform: translateX(-10px);}
        .nav-brand h1 { font-family: 'Aleo', serif; font-size: 1.1rem; color: white; margin: 0; letter-spacing: 0.5px; }

        /* --- 4. HERO BANNER GENRE --- */
        .genre-hero {
            background: linear-gradient(135deg, var(--primary) 0%, #0f172a 100%);
            padding: 30px 20px; text-align: center; color: white;
            position: relative; overflow: hidden;
        }
        .genre-hero::after {
            content: '\f5fd'; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: -10px; bottom: -20px; font-size: 8rem;
            color: rgba(255, 255, 255, 0.05); pointer-events: none; transform: rotate(-15deg);
        }
        .genre-hero h2 {
            font-family: 'Playfair Display', serif; font-size: 1.8rem;
            margin: 0 0 5px 0; color: var(--gold); position: relative; z-index: 2;
        }
        .genre-hero p {
            font-size: 0.85rem; color: #cbd5e1; margin: 0; position: relative; z-index: 2;
        }

        /* --- 5. STORY LIST (VERTICAL) --- */
        .story-list-container {
            padding: 20px;
            flex: 1;
            display: flex; flex-direction: column; gap: 15px;
        }

        .story-card-list {
            display: flex; gap: 15px; background: white; padding: 15px;
            border-radius: 16px; border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer;
            transition: 0.3s;
        }
        .story-card-list:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }

        .story-cover {
            width: 75px; height: 110px; border-radius: 8px;
            background-color: #cbd5e1; background-size: cover; background-position: center;
            flex-shrink: 0; border: 1px solid #e2e8f0;
        }

        .story-info {
            display: flex; flex-direction: column; justify-content: center; flex: 1; overflow: hidden;
        }
        .story-info h3 {
            font-size: 1.05rem; font-weight: 700; color: var(--primary);
            margin: 0 0 5px 0; line-height: 1.2;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .story-info .author {
            font-size: 0.8rem; color: var(--text-gray); margin: 0 0 8px 0;
            display: flex; align-items: center; gap: 6px;
        }
        
        .story-meta-row {
            display: flex; align-items: center; gap: 12px;
            font-size: 0.75rem; color: var(--text-gray); font-weight: 600;
        }
        .story-meta-row span { display: flex; align-items: center; gap: 4px; }
        
        .synopsis {
            font-size: 0.75rem; color: #94a3b8; margin: 8px 0 0 0;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            line-height: 1.4;
        }

        /* LOADING & EMPTY STATE */
        .empty-state { text-align: center; padding: 50px 20px; color: #94a3b8; border: 2px dashed #cbd5e1; border-radius: 16px; margin-top: 10px; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: #cbd5e1; }
        .empty-state p { margin: 0; font-size: 0.95rem; }

        #loading-overlay {
            position: absolute; top: 150px; left: 0; width: 100%; height: calc(100% - 150px);
            background: var(--bg-color); z-index: 500; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e2e8f0;
            border-top-color: var(--gold); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="app-wrapper">
        
        <!-- NAVBAR -->
        <header class="top-navbar">
            <a href="genre.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="nav-brand">
                <h1 id="navbar-title">Daftar Karya</h1>
            </div>
            <div style="width: 24px;"></div> <!-- Spacer -->
        </header>

        <!-- HERO BANNER GENRE -->
        <div class="genre-hero">
            <h2 id="hero-genre-name">Memuat...</h2>
            <p id="hero-genre-count">Menyiapkan daftar cerita</p>
        </div>

        <!-- AREA LIST CERITA -->
        <div class="story-list-container" id="story-list-container" style="position: relative;">
            
            <div id="loading-overlay">
                <div class="spinner"></div>
                <div style="color: var(--primary); font-weight: 500; font-size: 0.9rem;">Menarik data dari rak buku...</div>
            </div>

            <div id="stories-grid">
                <!-- Akan diisi otomatis oleh JavaScript -->
            </div>
            
        </div>

    </div>

    <!-- Script SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Konfigurasi Database Cendekia Aksara
        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let isUserLoggedIn = false;

        // Cek Status Login untuk keperluan fungsi klik
        onAuthStateChanged(auth, (user) => {
            if (user) {
                isUserLoggedIn = true;
            } else {
                isUserLoggedIn = false;
            }
        });

        // Mengambil Parameter Genre dari URL (?genre=Romansa)
        const urlParams = new URLSearchParams(window.location.search);
        let selectedGenre = urlParams.get('genre') || 'Umum';

        // Update teks di header agar sesuai dengan genre yang diklik
        document.getElementById('navbar-title').innerText = selectedGenre;
        document.getElementById('hero-genre-name').innerText = `Kategori: ${selectedGenre}`;

        async function fetchStoriesByGenre() {
            try {
                // Tarik semua cerita (diurutkan berdasarkan views tertinggi)
                // Kita filter di JavaScript agar logika deteksi huruf besar/kecil seragam dengan halaman genre.html
                const q = query(collection(db, "published_stories"), orderBy("views", "desc"));
                const snap = await getDocs(q);
                
                let filteredStories = [];

                snap.forEach(doc => {
                    const data = { id: doc.id, ...doc.data() };
                    
                    // Standarisasi pembacaan nama genre dari database
                    let dbGenreName = data.genre ? data.genre.trim() : "Umum";
                    dbGenreName = dbGenreName.charAt(0).toUpperCase() + dbGenreName.slice(1).toLowerCase();

                    // Jika cocok dengan genre yang dipilih, masukkan ke array
                    if (dbGenreName === selectedGenre) {
                        filteredStories.push(data);
                    }
                });

                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('hero-genre-count').innerText = `Ditemukan ${filteredStories.length} cerita menakjubkan`;

                renderStoryList(filteredStories);

            } catch (error) {
                console.error("Gagal menarik data cerita:", error);
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('hero-genre-count').innerText = "Terjadi kesalahan";
                document.getElementById('stories-grid').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <p>Gagal memuat daftar cerita.<br>Periksa koneksi internet Anda.</p>
                    </div>
                `;
            }
        }

        function renderStoryList(stories) {
            const container = document.getElementById('stories-grid');
            container.innerHTML = '';

            if (stories.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-book-open-reader"></i>
                        <p>Belum ada karya yang diterbitkan dalam genre <b>${selectedGenre}</b>.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            stories.forEach(data => {
                const coverBg = data.coverBase64 ? `url('${data.coverBase64}')` : "none";
                const synopsisText = data.synopsis ? data.synopsis : "Penulis belum mencantumkan sinopsis untuk cerita ini.";
                
                html += `
                    <div class="story-card-list" onclick="requireLogin('membaca cerita', 'read.html?id=${data.id}')">
                        <div class="story-cover" style="background-image: ${coverBg};"></div>
                        <div class="story-info">
                            <h3>${data.title}</h3>
                            <p class="author"><i class="fa-solid fa-pen-nib"></i> ${data.authorName || 'Anonim'}</p>
                            <div class="story-meta-row">
                                <span><i class="fa-solid fa-eye"></i> ${data.views || 0}</span>
                                <span><i class="fa-solid fa-star" style="color:var(--gold)"></i> ${data.rating || '0.0'}</span>
                                ${data.isCompleted ? '<span style="color:#10b981;"><i class="fa-solid fa-check-circle"></i> Tamat</span>' : '<span style="color:#f59e0b;"><i class="fa-solid fa-spinner"></i> On-Going</span>'}
                            </div>
                            <p class="synopsis">${synopsisText}</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // --- SISTEM LINK DINAMIS & INTERSEP ---
        window.requireLogin = (actionName, targetUrl) => {
            if(isUserLoggedIn) {
                window.location.href = targetUrl; // Langsung tembus ke read.html jika sudah login
            } else {
                Swal.fire({
                    title: 'Akses Terbatas',
                    text: `Silakan masuk atau buat akun terlebih dahulu untuk ${actionName}. Gratis dan cepat!`,
                    icon: 'info',
                    showCancelButton: true,
                    confirmButtonColor: '#003366',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Masuk / Daftar',
                    cancelButtonText: 'Batal',
                    reverseButtons: true
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = 'login.html';
                    }
                });
            }
        };

        // Tarik data saat halaman dibuka
        window.onload = () => {
            fetchStoriesByGenre();
        };
    </script>
</body>
</html>
