<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Info Cerita - Cendekia Aksara</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* --- GLOBAL & COLORS --- */
        :root {
            --nav-bg: #0f172a;       
            --primary: #003366;      
            --gold: #d4af37;         
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif; background-color: var(--bg-color);
            color: var(--text-dark); margin: 0; padding: 0; padding-top: 60px; min-height: 100vh;
        }

        /* --- MOBILE FIRST WRAPPER --- */
        .app-wrapper {
            width: 100%; max-width: 480px; margin: 0 auto;
            background-color: white; min-height: 100vh;
            display: flex; flex-direction: column; position: relative;
        }

        @media (min-width: 768px) {
            body { background-color: #e2e8f0; } 
            .app-wrapper { border-left: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; box-shadow: 0 0 40px rgba(0,0,0,0.1); }
            .top-navbar { max-width: 480px; left: 50% !important; transform: translateX(-50%); }
        }

        /* --- FIXED NAVBAR --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-bottom: 2px solid var(--gold);
        }
        .btn-back { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; transition: 0.2s; text-decoration: none; }
        .btn-back:hover { color: var(--gold); }
        .nav-title { font-family: 'Aleo', serif; font-size: 1.1rem; color: white; margin: 0; }
        
        .save-indicator {
            font-size: 0.75rem; font-weight: 600; color: #10b981;
            background: rgba(16, 185, 129, 0.15); padding: 4px 10px; border-radius: 50px;
            display: flex; align-items: center; gap: 5px; opacity: 0; transition: opacity 0.3s;
        }
        .save-indicator.saving { color: #f59e0b; background: rgba(245, 158, 11, 0.15); opacity: 1; }
        .save-indicator.saved { color: #10b981; background: rgba(16, 185, 129, 0.15); opacity: 1; }

        /* --- CONTENT AREA --- */
        .content-area { padding: 20px; flex: 1; }

        /* Cover Uploader */
        .cover-uploader {
            width: 130px; height: 190px; margin: 0 auto 25px auto;
            background-color: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; position: relative; overflow: hidden; transition: 0.3s;
        }
        .cover-uploader:hover { border-color: var(--primary); background-color: #e2e8f0; }
        .cover-preview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; z-index: 2; display: none;
        }
        .cover-uploader i { font-size: 2rem; color: #94a3b8; margin-bottom: 8px; z-index: 1;}
        .cover-uploader span { font-size: 0.75rem; color: #64748b; font-weight: 600; text-align: center; z-index: 1; padding: 0 10px;}
        #cover-file { display: none; }

        /* Form Inputs */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .form-input, .form-select, textarea {
            width: 100%; padding: 14px 15px; border: 1px solid #cbd5e1; border-radius: 12px;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; background: #f8fafc;
            color: var(--text-dark); transition: 0.3s; outline: none;
        }
        .form-input:focus, .form-select:focus, textarea:focus {
            background: white; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }
        textarea { resize: vertical; min-height: 120px; line-height: 1.5; }

        /* --- CHAPTERS SECTION --- */
        .chapter-section { margin-top: 35px; border-top: 2px dashed #e2e8f0; padding-top: 25px; }
        .chapter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chapter-header h3 { font-family: 'Aleo', serif; font-size: 1.2rem; color: var(--primary); margin: 0; }

        .chapter-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;}
        .chapter-card {
            background: white; border: 1px solid #cbd5e1; padding: 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: 0.2s;
        }
        .chapter-card:hover { border-color: var(--primary); transform: translateX(5px); }
        .chapter-info h4 { margin: 0 0 4px 0; font-size: 0.95rem; color: var(--text-dark); }
        .chapter-info p { margin: 0; font-size: 0.75rem; color: var(--text-gray); display: flex; gap: 10px;}
        .chapter-status { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
        .status-draft { background: #f1f5f9; color: #64748b; }
        .status-published { background: #dcfce7; color: #166534; }

        .btn-add-chapter {
            width: 100%; background: linear-gradient(135deg, var(--gold), #b45309);
            color: white; border: none; padding: 14px; border-radius: 50px;
            font-family: 'Poppins'; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;
        }
        .btn-add-chapter:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); }

        .empty-chapter { text-align: center; padding: 20px; color: #94a3b8; font-size: 0.85rem; border: 1px dashed #cbd5e1; border-radius: 12px; }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 5000; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;}
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- OVERLAY LOADING AWAL -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="color: var(--primary); font-weight: 500; font-size: 0.9rem;">Menyiapkan Draf...</div>
    </div>

    <div class="app-wrapper">
        
        <!-- NAVBAR -->
        <header class="top-navbar">
            <a href="menulis.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 class="nav-title">Info Cerita</h1>
            <!-- Indikator Auto-Save -->
            <div class="save-indicator" id="save-indicator">
                <i class="fa-solid fa-check"></i> Tersimpan
            </div>
        </header>

        <div class="content-area">
            
            <!-- UPLOAD COVER BASE64 -->
            <div class="cover-uploader" onclick="document.getElementById('cover-file').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Unggah Sampul</span>
                <div class="cover-preview" id="cover-preview"></div>
            </div>
            <input type="file" id="cover-file" accept="image/png, image/jpeg, image/jpg" onchange="handleCoverUpload(event)">

            <!-- FORM AUTO-SAVE -->
            <div class="form-group">
                <label>Judul Cerita</label>
                <input type="text" id="story-title" class="form-input" placeholder="Tuliskan judul yang menarik..." oninput="triggerAutoSave()">
            </div>

            <div class="form-group">
                <label>Pilih Genre Utama</label>
                <select id="story-genre" class="form-select" onchange="triggerAutoSave()">
                    <option value="">Pilih Genre</option>
                    <option value="Romansa">Romansa</option>
                    <option value="Fantasi">Fantasi</option>
                    <option value="Fiksi Ilmiah">Fiksi Ilmiah (Sci-Fi)</option>
                    <option value="Misteri">Misteri / Thriller</option>
                    <option value="Horor">Horor</option>
                    <option value="Aksi">Aksi / Petualangan</option>
                    <option value="Religi">Spiritual / Religi</option>
                    <option value="Komedi">Komedi</option>
                    <option value="Remaja">Fiksi Remaja (Teenlit)</option>
                    <option value="Sejarah">Fiksi Sejarah</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sinopsis / Deskripsi</label>
                <textarea id="story-desc" placeholder="Tuliskan sinopsis singkat untuk memikat pembaca..." oninput="triggerAutoSave()"></textarea>
            </div>

            <!-- MANAJEMEN BAB -->
            <div class="chapter-section">
                <div class="chapter-header">
                    <h3>Daftar Bab</h3>
                </div>
                
                <div class="chapter-list" id="chapter-list">
                    <!-- Dinamis Diisi oleh JS -->
                    <div class="empty-chapter"><i class="fa-solid fa-spinner fa-spin"></i> Memuat bab...</div>
                </div>

                <button class="btn-add-chapter" onclick="createNewChapter()">
                    <i class="fa-solid fa-pen-to-square"></i> Tulis Bab Baru
                </button>
            </div>

        </div>
    </div>

    <!-- Script SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0",
            authDomain: "mading-cf676.firebaseapp.com",
            projectId: "mading-cf676",
            storageBucket: "mading-cf676.firebasestorage.app",
            messagingSenderId: "72175203671",
            appId: "1:72175203671:web:7a0676a55beb64bc96ba12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let storyId = new URLSearchParams(window.location.search).get('id');
        let saveTimeout; // Untuk sistem debounce Auto-Save

        // Cek Parameter & Login
        if (!storyId) {
            window.location.href = 'menulis.html';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadStoryData();
                listenToChapters();
            } else {
                window.location.href = 'login.html';
            }
        });

        // 1. Ambil Data Cerita (Load Form)
        async function loadStoryData() {
            try {
                const docRef = doc(db, "stories", storyId);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const data = snap.data();
                    
                    // Keamanan: Cek apakah ini benar cerita milik user yang login
                    if (data.authorId !== currentUser.uid) {
                        Swal.fire('Akses Ditolak', 'Anda tidak memiliki hak akses ke draf ini.', 'error').then(()=>window.location.href = 'menulis.html');
                        return;
                    }

                    // Isi ke Form
                    document.getElementById('story-title').value = data.title || '';
                    document.getElementById('story-genre').value = data.genre || '';
                    document.getElementById('story-desc').value = data.description || '';

                    if (data.coverBase64) {
                        const preview = document.getElementById('cover-preview');
                        preview.style.backgroundImage = `url('${data.coverBase64}')`;
                        preview.style.display = 'block';
                    }

                    document.getElementById('loading-overlay').style.display = 'none';
                } else {
                    Swal.fire('Error', 'Data cerita tidak ditemukan.', 'error').then(()=>window.location.href = 'menulis.html');
                }
            } catch (error) {
                console.error("Gagal memuat cerita:", error);
                Swal.fire('Error', 'Terjadi kesalahan sistem.', 'error');
            }
        }

        // 2. Sistem Auto-Save Berbasis Debounce
        window.triggerAutoSave = () => {
            const indicator = document.getElementById('save-indicator');
            
            // Set ke mode "Menyimpan..."
            indicator.className = 'save-indicator saving';
            indicator.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
            
            // Hapus timer sebelumnya jika user masih mengetik
            clearTimeout(saveTimeout);
            
            // Tunggu 1.5 detik setelah user berhenti mengetik, baru simpan
            saveTimeout = setTimeout(saveToFirestore, 1500);
        };

        async function saveToFirestore() {
            const title = document.getElementById('story-title').value;
            const genre = document.getElementById('story-genre').value;
            const desc = document.getElementById('story-desc').value;
            const indicator = document.getElementById('save-indicator');

            try {
                await updateDoc(doc(db, "stories", storyId), {
                    title: title,
                    genre: genre,
                    description: desc,
                    updatedAt: serverTimestamp()
                });

                // Mode "Tersimpan"
                indicator.className = 'save-indicator saved';
                indicator.innerHTML = '<i class="fa-solid fa-check"></i> Tersimpan';
                
                // Hilangkan indikator setelah 3 detik
                setTimeout(() => { indicator.style.opacity = '0'; }, 3000);
            } catch (error) {
                console.error("Gagal auto-save:", error);
                indicator.innerHTML = '<i class="fa-solid fa-xmark"></i> Gagal Menyimpan';
                indicator.style.color = '#dc2626';
            }
        }

        // 3. Konversi & Auto-Save Sampul (Cover) ke Base64
        window.handleCoverUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // Validasi Ukuran (Maks 2MB)
            if (file.size > 2 * 1024 * 1024) {
                Swal.fire('Ukuran Terlalu Besar', 'Maksimal ukuran gambar adalah 2MB agar aplikasi tetap ringan.', 'warning');
                return;
            }

            const indicator = document.getElementById('save-indicator');
            indicator.className = 'save-indicator saving';
            indicator.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengunggah...';

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64String = e.target.result;
                
                // Tampilkan Preview
                const preview = document.getElementById('cover-preview');
                preview.style.backgroundImage = `url('${base64String}')`;
                preview.style.display = 'block';

                // Langsung Update ke Database
                try {
                    await updateDoc(doc(db, "stories", storyId), {
                        coverBase64: base64String,
                        updatedAt: serverTimestamp()
                    });
                    
                    indicator.className = 'save-indicator saved';
                    indicator.innerHTML = '<i class="fa-solid fa-check"></i> Sampul Tersimpan';
                    setTimeout(() => { indicator.style.opacity = '0'; }, 3000);
                } catch (err) {
                    Swal.fire('Error', 'Gagal menyimpan sampul ke database.', 'error');
                }
            };
            reader.readAsDataURL(file);
        };

        // 4. Listener Daftar Bab (Realtime)
        function listenToChapters() {
            // Bab disimpan dalam Sub-collection 'chapters' di dalam dokumen 'stories'
            const q = query(collection(db, "stories", storyId, "chapters"), orderBy("createdAt", "asc"));
            
            onSnapshot(q, (snap) => {
                const listContainer = document.getElementById('chapter-list');
                
                if (snap.empty) {
                    listContainer.innerHTML = `<div class="empty-chapter">Cerita ini belum memiliki bab. Klik tombol di bawah untuk memulai tulisan pertamamu.</div>`;
                    return;
                }

                let html = '';
                let babCount = 1;
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const statusClass = data.status === 'published' ? 'status-published' : 'status-draft';
                    const statusText = data.status === 'published' ? 'Dipublikasikan' : 'Draf';
                    const wordCount = data.wordCount || 0;

                    html += `
                        <div class="chapter-card" onclick="window.location.href='menulis-editor.html?storyId=${storyId}&chapterId=${docSnap.id}'">
                            <div class="chapter-info">
                                <h4>Bab ${babCount}: ${data.title || 'Bab Tanpa Judul'}</h4>
                                <p>
                                    <span class="chapter-status ${statusClass}">${statusText}</span>
                                    <span><i class="fa-solid fa-file-word"></i> ${wordCount} Kata</span>
                                </p>
                            </div>
                            <i class="fa-solid fa-chevron-right" style="color:#cbd5e1;"></i>
                        </div>
                    `;
                    babCount++;
                });

                listContainer.innerHTML = html;
            });
        }

        // 5. Buat Bab Baru & Arahkan ke Editor
        window.createNewChapter = async () => {
            const title = document.getElementById('story-title').value.trim();
            if (!title) {
                Swal.fire('Judul Cerita Kosong', 'Harap isi Judul Cerita terlebih dahulu sebelum menulis bab baru.', 'warning');
                return;
            }

            document.getElementById('loading-msg').innerText = "Menyiapkan Kertas Editor...";
            document.getElementById('loading-overlay').style.display = 'flex';

            try {
                // Buat Dokumen Bab Baru
                const chapterRef = await addDoc(collection(db, "stories", storyId, "chapters"), {
                    title: '',
                    content: '', // Naskah Kosong
                    status: 'draft',
                    wordCount: 0,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                });

                // Update jumlah chapter di dokumen utama cerita
                // (Agar mudah dihitung di beranda tanpa query semua bab)
                const docRef = doc(db, "stories", storyId);
                const snap = await getDoc(docRef);
                const currentCount = snap.exists() && snap.data().chapterCount ? snap.data().chapterCount : 0;
                
                await updateDoc(docRef, {
                    chapterCount: currentCount + 1,
                    updatedAt: serverTimestamp()
                });

                // Arahkan ke Editor Naskah
                window.location.href = `menulis-editor.html?storyId=${storyId}&chapterId=${chapterRef.id}`;

            } catch (error) {
                console.error("Gagal membuat bab:", error);
                document.getElementById('loading-overlay').style.display = 'none';
                Swal.fire('Error', 'Gagal membuat bab baru.', 'error');
            }
        };
    </script>
</body>
</html>
