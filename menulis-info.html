<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Info Cerita - Cendekia Aksara</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aleo:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        :root {
            --nav-bg: #0f172a;       
            --primary: #003366;      
            --gold: #d4af37;         
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; padding-top: 60px; min-height: 100vh; }

        .app-wrapper { width: 100%; max-width: 480px; margin: 0 auto; background-color: white; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
        @media (min-width: 768px) { body { background-color: #e2e8f0; } .app-wrapper { border-left: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; box-shadow: 0 0 40px rgba(0,0,0,0.1); } .top-navbar { max-width: 480px; left: 50% !important; transform: translateX(-50%); } }

        .top-navbar { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 2px solid var(--gold); }
        .btn-back { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .nav-title { font-family: 'Aleo', serif; font-size: 1.1rem; color: white; margin: 0; }
        
        .nav-right-actions { display: flex; align-items: center; gap: 10px; }
        .save-indicator { font-size: 0.75rem; font-weight: 600; color: #10b981; background: rgba(16, 185, 129, 0.15); padding: 4px 10px; border-radius: 50px; display: flex; align-items: center; gap: 5px; opacity: 0; transition: opacity 0.3s; }
        .save-indicator.saving { color: #f59e0b; background: rgba(245, 158, 11, 0.15); opacity: 1; }
        .save-indicator.saved { color: #10b981; background: rgba(16, 185, 129, 0.15); opacity: 1; }
        .btn-save-manual { background: var(--gold); color: white; border: none; padding: 6px 15px; border-radius: 50px; font-family: 'Poppins'; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 8px rgba(212,175,55,0.3); }
        .btn-save-manual:hover { background: #b45309; transform: translateY(-1px); }

        .content-area { padding: 20px; flex: 1; }

        .cover-uploader { width: 130px; height: 190px; margin: 0 auto 25px auto; background-color: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; position: relative; overflow: hidden; }
        .cover-preview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 2; display: none; }
        .cover-uploader i { font-size: 2rem; color: #94a3b8; margin-bottom: 8px; z-index: 1;}
        .cover-uploader span { font-size: 0.75rem; color: #64748b; font-weight: 600; text-align: center; z-index: 1; padding: 0 10px;}
        #cover-file { display: none; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .form-input, .form-select, textarea { width: 100%; padding: 14px 15px; border: 1px solid #cbd5e1; border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; background: #f8fafc; color: var(--text-dark); transition: 0.3s; outline: none; }
        .form-input:focus, .form-select:focus, textarea:focus { background: white; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1); }
        textarea { resize: vertical; min-height: 120px; line-height: 1.5; }

        /* TAGS INPUT UI */
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 12px; background: #f8fafc; min-height: 52px; align-items: center; transition: 0.3s;}
        .tags-container:focus-within { background: white; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1); }
        .tag-chip { background: var(--primary); color: white; padding: 4px 10px; border-radius: 50px; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; }
        .tag-chip i { cursor: pointer; font-size: 0.9rem; }
        .tag-input { border: none; outline: none; background: transparent; flex: 1; min-width: 120px; font-family: 'Poppins'; font-size: 0.9rem; color: var(--text-dark); }

        /* MANAJEMEN BAB */
        .chapter-section { margin-top: 35px; border-top: 2px dashed #e2e8f0; padding-top: 25px; }
        .chapter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chapter-header h3 { font-family: 'Aleo', serif; font-size: 1.2rem; color: var(--primary); margin: 0; }
        
        .chapter-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;}
        .chapter-card { background: white; border: 1px solid #cbd5e1; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .chapter-info { flex: 1; cursor: pointer; }
        .chapter-info h4 { margin: 0 0 4px 0; font-size: 0.95rem; color: var(--text-dark); }
        .chapter-info p { margin: 0; font-size: 0.75rem; color: var(--text-gray); display: flex; gap: 10px; align-items: center;}
        
        .chapter-status { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
        .status-draft { background: #f1f5f9; color: #64748b; }
        .status-published { background: #dcfce7; color: #166534; }
        
        /* Tombol Aksi Bab (Hapus & Draf) */
        .chapter-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn { width: 32px; height: 32px; border: none; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .action-btn.warning { background: #fef3c7; color: #d97706; }
        .action-btn.warning:hover { background: #d97706; color: white; }
        .action-btn.danger { background: #fee2e2; color: #dc2626; }
        .action-btn.danger:hover { background: #dc2626; color: white; }

        .btn-add-chapter { width: 100%; background: linear-gradient(135deg, var(--gold), #b45309); color: white; border: none; padding: 14px; border-radius: 50px; font-family: 'Poppins'; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .empty-chapter { text-align: center; padding: 20px; color: #94a3b8; font-size: 0.85rem; border: 1px dashed #cbd5e1; border-radius: 12px; }

        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;}
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay"><div class="spinner"></div><div id="loading-msg" style="color: var(--primary); font-weight: 500; font-size: 0.9rem;">Menyiapkan Draf...</div></div>

    <div class="app-wrapper">
        <header class="top-navbar">
            <div style="display:flex; align-items:center; gap:12px;">
                <a href="menulis.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
                <h1 class="nav-title">Info Cerita</h1>
            </div>
            <div class="nav-right-actions">
                <div class="save-indicator" id="save-indicator"><i class="fa-solid fa-check"></i></div>
                <button class="btn-save-manual" onclick="manualSave()"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
            </div>
        </header>

        <div class="content-area">
            <div class="cover-uploader" onclick="document.getElementById('cover-file').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i><span>Unggah Sampul</span>
                <div class="cover-preview" id="cover-preview"></div>
            </div>
            <input type="file" id="cover-file" accept="image/png, image/jpeg, image/jpg" onchange="handleCoverUpload(event)">

            <div class="form-group">
                <label>Judul Cerita</label>
                <input type="text" id="story-title" class="form-input" placeholder="Tuliskan judul yang menarik..." oninput="triggerAutoSave()">
            </div>

            <div class="form-group">
                <label>Genre Utama</label>
                <select id="story-genre" class="form-select" onchange="triggerAutoSave()">
                    <option value="">Pilih Genre</option>
                    <option value="Romansa">Romansa</option>
                    <option value="Fantasi">Fantasi</option>
                    <option value="Fiksi Ilmiah">Fiksi Ilmiah</option>
                    <option value="Misteri">Misteri / Thriller</option>
                    <option value="Horor">Horor</option>
                    <option value="Aksi">Aksi / Petualangan</option>
                    <option value="Religi">Spiritual / Religi</option>
                    <option value="Komedi">Komedi</option>
                    <option value="Remaja">Fiksi Remaja</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tagar / Event (Opsional)</label>
                <div class="tags-container" id="tags-container">
                    <input type="text" class="tag-input" id="tag-input" placeholder="Ketik tagar lalu Enter...">
                </div>
            </div>

            <div class="form-group">
                <label>Sinopsis</label>
                <textarea id="story-desc" placeholder="Tuliskan sinopsis singkat..." oninput="triggerAutoSave()"></textarea>
            </div>

            <div class="chapter-section">
                <div class="chapter-header"><h3>Daftar Bab</h3></div>
                <div class="chapter-list" id="chapter-list"><div class="empty-chapter">Memuat bab...</div></div>
                <button class="btn-add-chapter" onclick="createNewChapter()"><i class="fa-solid fa-pen-to-square"></i> Tulis Bab Baru</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // PERBAIKAN: Menambahkan deleteDoc ke dalam import list
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyDpUWUIzPXIZN6rrNtsIqcL6VfOE2RLVl0", authDomain: "mading-cf676.firebaseapp.com", projectId: "mading-cf676", storageBucket: "mading-cf676.firebasestorage.app", messagingSenderId: "72175203671", appId: "1:72175203671:web:7a0676a55beb64bc96ba12" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let realAuthorName = "Penulis Anonim";
        let storyId = new URLSearchParams(window.location.search).get('id');
        let saveTimeout;
        let storyTags = [];

        if (!storyId) window.location.href = 'menulis.html';

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if(userSnap.exists()) { realAuthorName = userSnap.data().name || user.displayName; }
                loadStoryData();
                listenToChapters();
            } else {
                window.location.href = 'login.html';
            }
        });

        async function loadStoryData() {
            try {
                const snap = await getDoc(doc(db, "stories", storyId));
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.authorId !== currentUser.uid) {
                        Swal.fire('Akses Ditolak', 'Bukan cerita Anda.', 'error').then(()=>window.location.href = 'menulis.html'); return;
                    }
                    document.getElementById('story-title').value = data.title || '';
                    document.getElementById('story-genre').value = data.genre || '';
                    document.getElementById('story-desc').value = data.description || '';
                    if (data.coverBase64) {
                        document.getElementById('cover-preview').style.backgroundImage = `url('${data.coverBase64}')`;
                        document.getElementById('cover-preview').style.display = 'block';
                    }
                    if (data.tags) {
                        storyTags = data.tags;
                        renderTags();
                    }
                    document.getElementById('loading-overlay').style.display = 'none';
                }
            } catch (error) { Swal.fire('Error', 'Gagal memuat.', 'error'); }
        }

        // TAGS LOGIC
        const tagInput = document.getElementById('tag-input');
        tagInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' || e.key === ',') {
                let tag = e.target.value.replace(',', '').trim().toLowerCase();
                if (tag && !storyTags.includes(tag) && storyTags.length < 5) {
                    storyTags.push(tag);
                    renderTags();
                    triggerAutoSave();
                } else if (storyTags.length >= 5) {
                    Swal.fire({toast:true, position:'top', icon:'warning', title:'Maksimal 5 tagar.', showConfirmButton:false, timer:1500});
                }
                e.target.value = '';
            }
        });

        function renderTags() {
            const container = document.getElementById('tags-container');
            document.querySelectorAll('.tag-chip').forEach(el => el.remove());
            
            storyTags.forEach((tag, index) => {
                const chip = document.createElement('div');
                chip.className = 'tag-chip';
                chip.innerHTML = `#${tag} <i class="fa-solid fa-xmark" onclick="removeTag(${index})"></i>`;
                container.insertBefore(chip, tagInput);
            });
        }
        window.removeTag = (index) => { storyTags.splice(index, 1); renderTags(); triggerAutoSave(); };

        // AUTO SAVE & MANUAL SAVE
        window.triggerAutoSave = () => {
            const indicator = document.getElementById('save-indicator');
            indicator.className = 'save-indicator saving'; indicator.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveToFirestore, 1500);
        };

        async function saveToFirestore() {
            const indicator = document.getElementById('save-indicator');
            try {
                await updateDoc(doc(db, "stories", storyId), {
                    title: document.getElementById('story-title').value,
                    genre: document.getElementById('story-genre').value,
                    description: document.getElementById('story-desc').value,
                    tags: storyTags,
                    authorName: realAuthorName,
                    updatedAt: serverTimestamp()
                });
                indicator.className = 'save-indicator saved'; indicator.innerHTML = '<i class="fa-solid fa-check"></i>';
                setTimeout(() => { indicator.style.opacity = '0'; }, 3000);
            } catch (error) { 
                indicator.innerHTML = '<i class="fa-solid fa-xmark"></i>'; indicator.style.color = '#dc2626'; 
                throw error; // Lempar error agar bisa ditangkap oleh Simpan Manual
            }
        }

        window.manualSave = async () => {
            clearTimeout(saveTimeout);
            Swal.fire({ title: 'Menyimpan Info Cerita...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await saveToFirestore();
                Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'Data Berhasil Disimpan', showConfirmButton: false, timer: 1500 });
            } catch (error) {
                Swal.fire('Gagal Menyimpan', 'Terjadi kesalahan sistem atau koneksi terputus.', 'error');
            }
        };

        window.handleCoverUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) { Swal.fire('Terlalu Besar', 'Maksimal 2MB.', 'warning'); return; }
            const reader = new FileReader();
            reader.onload = async function(e) {
                const b64 = e.target.result;
                document.getElementById('cover-preview').style.backgroundImage = `url('${b64}')`;
                document.getElementById('cover-preview').style.display = 'block';
                await updateDoc(doc(db, "stories", storyId), { coverBase64: b64, updatedAt: serverTimestamp() });
            };
            reader.readAsDataURL(file);
        };

        // MANAJEMEN BAB
        function listenToChapters() {
            const q = query(collection(db, "stories", storyId, "chapters"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snap) => {
                const listContainer = document.getElementById('chapter-list');
                if (snap.empty) { listContainer.innerHTML = `<div class="empty-chapter">Belum ada bab. Mulai tulis bab pertamamu!</div>`; return; }
                
                let html = ''; let babCount = 1;
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    
                    // Tombol Unpublish khusus untuk bab yang sudah Rilis
                    const unpublishBtn = data.status === 'published' 
                        ? `<button class="action-btn warning" onclick="unpublishChapter('${docSnap.id}', event)" title="Tarik ke Draf"><i class="fa-solid fa-eye-slash"></i></button>`
                        : '';

                    html += `
                        <div class="chapter-card">
                            <div class="chapter-info" onclick="window.location.href='menulis-editor.html?storyId=${storyId}&chapterId=${docSnap.id}'">
                                <h4>Bab ${babCount}: ${data.title || 'Tanpa Judul'}</h4>
                                <p>
                                    <span class="chapter-status ${data.status === 'published' ? 'status-published' : 'status-draft'}">${data.status === 'published' ? 'Rilis' : 'Draf'}</span>
                                    <span><i class="fa-solid fa-file-word"></i> ${data.wordCount || 0} Kata</span>
                                </p>
                            </div>
                            <div class="chapter-actions">
                                ${unpublishBtn}
                                <button class="action-btn danger" onclick="deleteChapter('${docSnap.id}', event)" title="Hapus Bab"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>
                    `;
                    babCount++;
                });
                listContainer.innerHTML = html;
            });
        }

        window.createNewChapter = async () => {
            if (!document.getElementById('story-title').value.trim()) { Swal.fire('Judul Kosong', 'Isi Judul Cerita dahulu sebelum menulis naskah.', 'warning'); return; }
            document.getElementById('loading-overlay').style.display = 'flex';
            try {
                const chapterRef = await addDoc(collection(db, "stories", storyId, "chapters"), { title: '', content: '', status: 'draft', wordCount: 0, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
                const docRef = doc(db, "stories", storyId);
                const snap = await getDoc(docRef);
                const currentCount = snap.exists() && snap.data().chapterCount ? snap.data().chapterCount : 0;
                await updateDoc(docRef, { chapterCount: currentCount + 1, updatedAt: serverTimestamp() });
                window.location.href = `menulis-editor.html?storyId=${storyId}&chapterId=${chapterRef.id}`;
            } catch (error) { document.getElementById('loading-overlay').style.display = 'none'; Swal.fire('Error', 'Gagal membuat bab.', 'error'); }
        };

        // FUNGSI HAPUS BAB
        window.deleteChapter = async (chapId, event) => {
            event.stopPropagation(); // Mencegah klik nyasar ke ruang editor
            const konfirmasi = await Swal.fire({
                title: 'Hapus Bab Ini?',
                text: 'Bab yang sudah dihapus tidak dapat dikembalikan lagi!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Hapus Permanen'
            });

            if (konfirmasi.isConfirmed) {
                Swal.fire({ title: 'Menghapus Bab...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try {
                    // Hapus dari sub-koleksi
                    await deleteDoc(doc(db, "stories", storyId, "chapters", chapId));
                    
                    // Kurangi total jumlah bab di dokumen utama
                    const docRef = doc(db, "stories", storyId);
                    const snap = await getDoc(docRef);
                    const currentCount = snap.exists() && snap.data().chapterCount ? snap.data().chapterCount : 1;
                    await updateDoc(docRef, { chapterCount: Math.max(0, currentCount - 1), updatedAt: serverTimestamp() });
                    
                    Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'Bab Berhasil Dihapus', showConfirmButton: false, timer: 1500 });
                } catch(e) {
                    Swal.fire('Error', 'Sistem gagal menghapus bab.', 'error');
                }
            }
        };

        // FUNGSI TARIK KE DRAF (UNPUBLISH)
        window.unpublishChapter = async (chapId, event) => {
            event.stopPropagation();
            const konfirmasi = await Swal.fire({
                title: 'Batalkan Publikasi?',
                text: 'Bab ini akan diubah statusnya menjadi draf dan tidak akan bisa dibaca lagi oleh publik.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#f59e0b',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Tarik ke Draf'
            });

            if (konfirmasi.isConfirmed) {
                Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try {
                    await updateDoc(doc(db, "stories", storyId, "chapters", chapId), { 
                        status: 'draft', 
                        updatedAt: serverTimestamp() 
                    });
                    
                    Swal.fire({ toast: true, position: 'top', icon: 'success', title: 'Bab dikembalikan ke Draf', showConfirmButton: false, timer: 1500 });
                } catch(e) {
                    Swal.fire('Error', 'Gagal membatalkan publikasi bab.', 'error');
                }
            }
        };
    </script>
</body>
</html>
